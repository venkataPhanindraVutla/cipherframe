name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  GOLANGCI_LINT_VERSION: v2.15.0
  GOFUMPT_VERSION: v0.12.0
  GOVULNCHECK_VERSION: v1.9.0
  GO_LICENSES_VERSION: v2.0.1
  GITLEAKS_VERSION: v8.30.1
  SQLC_VERSION: v1.31.1
  # Keep in sync with CONTRIBUTING.md ("Dependency licence policy").
  ALLOWED_LICENSES: Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0

jobs:
  format:
    name: format (gofumpt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - run: go install mvdan.cc/gofumpt@${GOFUMPT_VERSION}
      - name: gofumpt -l
        run: |
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofumpt:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags=integration,media

  test:
    name: vet and unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - run: go vet -tags=media ./...
      - run: go test -race -count=1 ./...
      - name: core builds without the cloud KMS SDKs (ADR 0022)
        run: |
          go build -tags nokms_aws,nokms_gcp ./...
          ! go list -deps -tags nokms_aws,nokms_gcp ./cmd/cipherframe-server | grep -E 'aws-sdk-go-v2/service/kms|cloud.google.com/go/kms'
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}
      - name: sqlc generated code is up to date
        run: sqlc diff
      - name: API generated code is up to date
        run: |
          go generate ./internal/api/gen ./internal/edge/gen
          if ! git diff --exit-code -- internal/api/gen internal/edge/gen; then
            echo "Generated API code is stale. Run: go generate ./internal/api/gen ./internal/edge/gen"
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- internal/api/gen internal/edge/gen)"
          if [ -n "$untracked" ]; then
            echo "Untracked generated files:"
            echo "$untracked"
            exit 1
          fi

  integration:
    name: integration (${{ matrix.pg_image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ADR 0017: minimum supported and current Postgres majors.
        pg_image: ["postgres:16.15", "postgres:18.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - name: integration tests (Postgres and SeaweedFS via testcontainers)
        env:
          CIPHERFRAME_TEST_PG_IMAGE: ${{ matrix.pg_image }}
        run: go test -race -count=1 -tags=integration ./...

  vuln:
    name: vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - run: govulncheck -tags=integration,media ./...

  licenses:
    name: licence check (go-licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - run: go install github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}
      - run: go-licenses check ./... --allowed_licenses="${ALLOWED_LICENSES}"
        env:
          GOFLAGS: -tags=integration,media

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - run: go install github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}
      # Pull requests scan only the commits they add, so another branch's reviewed fixtures cannot
      # fail them. Pushes scan the pushed branch's full history (not every branch) as a backstop.
      # Rules: .gitleaks.toml (default rules plus a narrow fixture allowlist); reviewed one-off false
      # positives: .gitleaksignore.
      - name: gitleaks (commits in this pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --log-opts="origin/${BASE_REF}..HEAD" .
      - name: gitleaks (full history of the pushed branch)
        if: github.event_name != 'pull_request'
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --log-opts="HEAD" .

  compose:
    name: compose (development stack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: deploy/compose/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the image and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: readiness and liveness
        run: |
          for port in 8080 8081; do
            ok=""
            for _ in $(seq 1 60); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/readyz")" = "200" ]; then
                ok=1
                break
              fi
              sleep 2
            done
            [ -n "$ok" ] || { echo "readyz on port ${port} did not return 200 within 2 minutes"; exit 1; }
            curl -fsS "http://127.0.0.1:${port}/readyz"; echo
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/healthz")" = "200"
          done
      - name: object storage refuses anonymous access
        run: |
          for bucket in cipherframe-source cipherframe-delivery; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8333/${bucket}/")"
            echo "anonymous GET ${bucket}: ${code}"
            test "${code}" = "403"
          done
      - name: bootstrap an API key and make an authenticated call
        run: |
          key="$(docker compose run --rm -T --no-deps server admin bootstrap --tenant-name ci --client-name ci)"
          echo "::add-mask::${key}"
          case "${key}" in cf_*_*) ;; *) echo "bootstrap did not print a key"; exit 1 ;; esac
          body="$(curl -fsS -H "Authorization: Bearer ${key}" http://127.0.0.1:8080/v1/whoami)"
          echo "${body}" | grep -q '"tenant_id":"ten_'
          echo "${body}" | grep -q '"admin"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/whoami)" = "401"
          bad="cf_000000000000_$(printf 'x%.0s' $(seq 1 43))"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${bad}" http://127.0.0.1:8080/v1/whoami)" = "401"
          echo "whoami OK; missing and wrong keys rejected with 401"
      - name: compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: tear down
        if: always()
        run: docker compose down -v

  media:
    name: media (worker image and FFmpeg tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # FFmpeg, x264 and dav1d compile in cached layers (GitHub Actions cache), so only the first
      # run, or a change to the pins in build/worker.Dockerfile, pays for the compile.
      - name: build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/worker.Dockerfile
          load: true
          tags: cipherframe-worker:ci
          cache-from: type=gha,scope=worker-image
          cache-to: type=gha,scope=worker-image,mode=max
      - name: export the test binaries (including the generator FFmpeg)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/worker.Dockerfile
          target: tools
          outputs: type=local,dest=out/tools
          cache-from: type=gha,scope=worker-image
      - name: image has the minimal FFmpeg, the licences and the source offer
        run: |
          docker run --rm --entrypoint /usr/local/bin/ffmpeg cipherframe-worker:ci -hide_banner -buildconf | tee out-buildconf.txt
          grep -q -- '--disable-everything' out-buildconf.txt
          grep -q -- '--disable-network' out-buildconf.txt
          docker image inspect cipherframe-worker:ci --format 'image size: {{.Size}} bytes'
          id="$(docker create cipherframe-worker:ci)"
          mkdir -p out/image
          docker cp "${id}:/usr/local/bin/ffmpeg" out/image/ffmpeg
          docker cp "${id}:/usr/local/bin/ffprobe" out/image/ffprobe
          docker cp "${id}:/usr/share/licenses/ffmpeg" out/licenses
          docker rm "${id}"
          for f in COPYING.GPLv2 COPYING.GPLv3 SOURCE.md x264-COPYING.GPLv2; do test -s "out/licenses/$f"; done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      # The binaries copied out of the image are static, so they run on the runner: put them on PATH
      # and run every package's integration tests with the media tests. Postgres and SeaweedFS
      # start through testcontainers on the runner's Docker. The fixtures come from the test-only
      # generator build (it also has the ssim and psnr filters the pipeline test uses to measure
      # quality; those filters are never in the shipped FFmpeg).
      - name: the image's ffmpeg and ffprobe on PATH
        run: |
          bin="${RUNNER_TEMP}/ffbin"
          mkdir -p "${bin}"
          cp out/image/ffmpeg out/image/ffprobe out/tools/ffmpeg-fixtures "${bin}/"
          chmod +x "${bin}"/*
          echo "${bin}" >> "${GITHUB_PATH}"
      - name: media, pipeline and integration tests against the image's binaries
        env:
          CIPHERFRAME_TEST_FFMPEG_FIXTURES: ${{ runner.temp }}/ffbin/ffmpeg-fixtures
        run: |
          export CIPHERFRAME_TEST_FFMPEG="$(command -v ffmpeg)" CIPHERFRAME_TEST_FFPROBE="$(command -v ffprobe)"
          go test -race -count=1 -tags=integration,media -v ./internal/...
