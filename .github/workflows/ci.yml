name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  GOLANGCI_LINT_VERSION: v2.15.0
  GOFUMPT_VERSION: v0.12.0
  GOVULNCHECK_VERSION: v1.9.0
  GO_LICENSES_VERSION: v2.0.1
  GITLEAKS_VERSION: v8.30.1
  SQLC_VERSION: v1.31.1
  # Keep in sync with CONTRIBUTING.md ("Dependency licence policy").
  ALLOWED_LICENSES: Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0
  # Runners are discarded after each job, so testcontainers' reaper (Ryuk) has nothing to clean up.
  # With several test binaries running at once, one binary's reaper could be removed just as another
  # one tried to reuse it ("unexpected container status removing"), failing the job at random.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  format:
    name: format (gofumpt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - run: go install mvdan.cc/gofumpt@${GOFUMPT_VERSION}
      - name: gofumpt -l
        run: |
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofumpt:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags=integration,media

  test:
    name: vet and unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - run: go vet -tags=media ./...
      - run: go test -race -count=1 ./...
      - name: core builds without the cloud KMS SDKs (ADR 0022)
        run: |
          go build -tags nokms_aws,nokms_gcp ./...
          ! go list -deps -tags nokms_aws,nokms_gcp ./cmd/cipherframe-server | grep -E 'aws-sdk-go-v2/service/kms|cloud.google.com/go/kms'
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}
      - name: sqlc generated code is up to date
        run: sqlc diff
      - name: API generated code is up to date
        run: |
          go generate ./internal/api/gen ./internal/edge/gen
          if ! git diff --exit-code -- internal/api/gen internal/edge/gen; then
            echo "Generated API code is stale. Run: go generate ./internal/api/gen ./internal/edge/gen"
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- internal/api/gen internal/edge/gen)"
          if [ -n "$untracked" ]; then
            echo "Untracked generated files:"
            echo "$untracked"
            exit 1
          fi

  integration:
    name: integration (${{ matrix.pg_image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ADR 0017: minimum supported and current Postgres majors.
        pg_image: ["postgres:16.15", "postgres:18.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - name: integration tests (Postgres and SeaweedFS via testcontainers)
        env:
          CIPHERFRAME_TEST_PG_IMAGE: ${{ matrix.pg_image }}
        run: go test -race -count=1 -tags=integration ./...
      - name: storage tests against Floci, a second S3 implementation (ADR 0035)
        # Storage does not use Postgres, so one matrix entry is enough.
        if: matrix.pg_image == 'postgres:18.6'
        env:
          CIPHERFRAME_TEST_S3_BACKEND: floci
        run: go test -race -count=1 -tags=integration ./internal/storage/

  vuln:
    name: vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - run: govulncheck -tags=integration,media ./...

  fuzz:
    name: fuzz (parsers, 20 s each, pushes to main only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      # One -fuzz target per go test run; "package:Target". A crash writes its input under
      # testdata/fuzz, which stays in the job's workspace, so the log names it.
      - name: fuzz each target for 20 seconds
        run: |
          for t in \
            hls:FuzzRewriteMaster hls:FuzzRewriteMedia hls:FuzzRewrite hls:FuzzAddSubtitles hls:FuzzRewriteThumbnailTrack \
            playback/token:FuzzVerify playback/token:FuzzOpen playback/token:FuzzTamper \
            auth:FuzzParseKey auth:FuzzBearerToken uploads:FuzzHashToken subtitles:FuzzParse \
            integrity/jcs:FuzzCanonicalize integrity/dsse:FuzzDSSEDecode integrity/merkle:FuzzVerifyInclusion; do
            echo "== ${t}"
            go test "./internal/${t%%:*}" -run '^$' -fuzz "^${t##*:}\$" -fuzztime 20s -parallel 2
          done

  licenses:
    name: licence check (go-licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - run: go install github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}
      - run: go-licenses check ./... --allowed_licenses="${ALLOWED_LICENSES}"
        env:
          GOFLAGS: -tags=integration,media

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - run: go install github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}
      # Pull requests scan only the commits they add, so another branch's reviewed fixtures cannot
      # fail them. Pushes scan the pushed branch's full history (not every branch) as a backstop.
      # Rules: .gitleaks.toml (default rules plus a narrow fixture allowlist); reviewed one-off false
      # positives: .gitleaksignore.
      - name: gitleaks (commits in this pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --log-opts="origin/${BASE_REF}..HEAD" .
      - name: gitleaks (full history of the pushed branch)
        if: github.event_name != 'pull_request'
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --log-opts="HEAD" .

  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      # No credentials and no plan: the examples are never applied from CI (ADR 0054, ADR 0056).
      - run: terraform fmt -check -recursive deploy/terraform
      - name: init and validate
        run: |
          for module in deploy/terraform/aws deploy/terraform/gcp; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
          done

  helm:
    name: helm (lint, template, kubeconform)
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v4.3.2
      HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install helm and kubeconform (pinned by SHA-256)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          curl -fsSL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Every values file is linted, rendered and validated against the Kubernetes 1.30 schemas.
      # ServiceMonitor and ScaledObject are CRDs of operators the chart does not install, and no
      # pinned schema source is used for them, so they are skipped.
      - name: lint, template, kubeconform
        run: |
          chart=deploy/helm/cipherframe
          for values in "$chart"/ci/*-values.yaml; do
            helm lint "$chart" -f "$values"
            helm template ci "$chart" -f "$values" > rendered.yaml
            kubeconform -strict -summary -kubernetes-version 1.30.0 -skip ServiceMonitor,ScaledObject rendered.yaml
            # The ingress must never route /metrics, /healthz or /readyz (docs/observability.md).
            helm template ci "$chart" -f "$values" --show-only templates/ingress.yaml > ingress.yaml || true
            if grep -E 'path: (/|/metrics|/healthz|/readyz)$' ingress.yaml; then exit 1; fi
          done

  observability:
    name: observability (alert rules, dashboard, secret scanner)
    runs-on: ubuntu-latest
    env:
      # The same pinned image the development stack runs; promtool ships in it.
      PROMETHEUS_IMAGE: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: promtool check rules and test rules
        run: |
          for cmd in "check rules alerts.yaml" "test rules alerts_test.yaml"; do
            docker run --rm --entrypoint promtool -v "${PWD}/deploy/observability/prometheus:/rules:ro" -w /rules "${PROMETHEUS_IMAGE}" ${cmd}
          done
      - name: promtool check config (scrape configuration)
        run: |
          docker run --rm --entrypoint promtool \
            -v "${PWD}/deploy/observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro" \
            -v "${PWD}/deploy/observability/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro" \
            -v "${PWD}/deploy/observability/dev/metrics-token:/etc/prometheus/cipherframe-metrics-token:ro" \
            "${PROMETHEUS_IMAGE}" check config /etc/prometheus/prometheus.yml
      - name: the dashboard is valid JSON and pins no data source UID
        run: |
          f=deploy/observability/grafana/cipherframe.json
          jq -e '.panels | length > 0' "${f}" >/dev/null
          test "$(jq -r '[.. | objects | select(has("uid") and (.type? == "prometheus")) | .uid] | unique | .[]' "${f}")" = '${DS_PROMETHEUS}'
      - name: secret scanner self-test
        run: deploy/compose/secret-scan-test.sh

  compose:
    name: compose (development stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The services send traces to the collector and serve /metrics (ADR 0058): the scan below reads
      # what that produced.
      COMPOSE_FILE: deploy/compose/compose.yaml:deploy/compose/compose.observability.yaml
      COMPOSE_PROFILES: observability
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: a plain "docker compose up" does not start the observability services
        run: |
          services="$(COMPOSE_PROFILES= COMPOSE_FILE=deploy/compose/compose.yaml docker compose config --services)"
          echo "${services}"
          for s in otel-collector prometheus grafana; do
            if echo "${services}" | grep -qx "${s}"; then echo "${s} is part of the default stack"; exit 1; fi
          done
          ! COMPOSE_PROFILES= COMPOSE_FILE=deploy/compose/compose.yaml docker compose config | grep -q 'OTEL_\|METRICS_TOKEN'
      - name: build the image and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: readiness and liveness
        run: |
          for port in 8080 8081; do
            ok=""
            for _ in $(seq 1 60); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/readyz")" = "200" ]; then
                ok=1
                break
              fi
              sleep 2
            done
            [ -n "$ok" ] || { echo "readyz on port ${port} did not return 200 within 2 minutes"; exit 1; }
            curl -fsS "http://127.0.0.1:${port}/readyz"; echo
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/healthz")" = "200"
          done
      - name: object storage refuses anonymous access
        run: |
          for bucket in cipherframe-source cipherframe-delivery; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8333/${bucket}/")"
            echo "anonymous GET ${bucket}: ${code}"
            test "${code}" = "403"
          done
      - name: bootstrap an API key and make an authenticated call
        run: |
          key="$(docker compose run --rm -T --no-deps server admin bootstrap --tenant-name ci --client-name ci)"
          echo "::add-mask::${key}"
          case "${key}" in cf_*_*) ;; *) echo "bootstrap did not print a key"; exit 1 ;; esac
          body="$(curl -fsS -H "Authorization: Bearer ${key}" http://127.0.0.1:8080/v1/whoami)"
          echo "${body}" | grep -q '"tenant_id":"ten_'
          echo "${body}" | grep -q '"admin"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/whoami)" = "401"
          bad="cf_000000000000_$(printf 'x%.0s' $(seq 1 43))"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${bad}" http://127.0.0.1:8080/v1/whoami)" = "401"
          echo "whoami OK; missing and wrong keys rejected with 401"
      # The command line tool end to end (ADR 0051). Processing needs the worker image with FFmpeg,
      # built from the same cached layers as the media job, and a tiny test video made with the
      # test-only FFmpeg (the shipped one cannot generate sources).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/worker.Dockerfile
          load: true
          tags: cipherframe-worker:dev
          cache-from: type=gha,scope=worker-image
          cache-to: type=gha,scope=worker-image,mode=max
      - name: export the test-only FFmpeg
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/worker.Dockerfile
          target: tools
          outputs: type=local,dest=out/tools
          cache-from: type=gha,scope=worker-image
      - name: start the worker
        run: docker compose --profile worker --profile observability up -d --no-build worker
      - name: cipherframe CLI end to end
        run: |
          go build -o "${RUNNER_TEMP}/cipherframe" ./cmd/cipherframe
          chmod +x out/tools/ffmpeg-fixtures
          out/tools/ffmpeg-fixtures -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=25 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac \
            -shortest "${RUNNER_TEMP}/test.mp4"
          # The secrets the run handles go to a file in a private directory, never to the job log.
          scan="$(mktemp -d "${RUNNER_TEMP}/scan.XXXXXX")"
          echo "SCAN_DIR=${scan}" >> "${GITHUB_ENV}"
          CIPHERFRAME_SCAN_SECRETS_FILE="${scan}/secrets" \
            deploy/compose/cli-e2e.sh "${RUNNER_TEMP}/cipherframe" "${RUNNER_TEMP}/test.mp4"
      - name: Prometheus scrapes the services and Grafana has the dashboard
        run: |
          # Retried together: a metric only appears once Prometheus has scraped after the e2e run.
          q() { curl -fsS "http://127.0.0.1:9090/api/v1/query?query=$1" | jq -r "$2"; }
          for _ in $(seq 1 40); do
            up="$(q 'count(up%7Bjob%3D~%22cipherframe-.*%22%7D%3D%3D1)' '.data.result[0].value[1] // "0"')"
            http="$(q cipherframe_http_request_duration_seconds_count '.data.result | length')"
            transcode="$(q cipherframe_transcode_duration_seconds_count '.data.result | length')"
            dash="$(curl -fsS -u admin:dev-placeholder-grafana 'http://127.0.0.1:3000/api/search?query=Cipherframe' | jq -r 'length')" # gitleaks:allow (development placeholder password)
            if [ "${up}" = "3" ] && [ "${http}" -gt 0 ] && [ "${transcode}" -gt 0 ] && [ "${dash}" = "1" ]; then exit 0; fi
            sleep 3
          done
          echo "not ready: up targets ${up}/3, http series ${http}, transcode series ${transcode}, dashboards ${dash}"
          exit 1
      - name: secret scan of the spans and the container logs
        run: |
          # Batch exporters send every few seconds; stopping the collector flushes its file.
          sleep 10
          docker compose --profile worker --profile observability stop otel-collector
          out="${SCAN_DIR}/out"
          mkdir -p "${out}/logs"
          docker compose --profile worker --profile observability cp otel-collector:/otel-out "${out}/spans"
          for svc in $(docker compose --profile worker --profile observability config --services); do
            docker compose --profile worker --profile observability logs --no-color --no-log-prefix "${svc}" > "${out}/logs/${svc}.log" 2>&1
          done
          # The scan means nothing if no spans arrived.
          grep -q 'ffmpeg transcode' "${out}/spans/traces.jsonl"
          grep -q 'GET /v1/play/{session_id}/key' "${out}/spans/traces.jsonl"
          deploy/compose/secret-scan.sh "${SCAN_DIR}/secrets" "${out}"
      - name: load tool smoke test
        run: |
          go build -o "${RUNNER_TEMP}/cipherframe-load" ./cmd/cipherframe-load
          deploy/compose/load-smoke.sh "${RUNNER_TEMP}/cipherframe" "${RUNNER_TEMP}/cipherframe-load" "${RUNNER_TEMP}/test.mp4" 3
      - name: compose logs
        if: failure()
        run: docker compose --profile worker --profile observability logs --no-color
      - name: tear down
        if: always()
        run: docker compose --profile worker --profile observability down -v

  player:
    name: player (TypeScript checks, unit tests, end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_FILE: deploy/compose/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: install (pnpm from the packageManager pin, lockfile frozen)
        working-directory: player
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: type check (tsc, strict)
        working-directory: player
        run: pnpm typecheck
      - name: unit tests
        working-directory: player
        run: pnpm test
      - name: build the library
        working-directory: player
        run: pnpm build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The worker image (FFmpeg) and the test-only generator FFmpeg come from the same cached layers
      # as the media job, so only a change to the pins in build/worker.Dockerfile pays for the compile.
      - name: build the worker image for the stack
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/worker.Dockerfile
          load: true
          tags: cipherframe-worker:dev
          cache-from: type=gha,scope=worker-image
      - name: export the generator FFmpeg
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/worker.Dockerfile
          target: tools
          outputs: type=local,dest=out/tools
          cache-from: type=gha,scope=worker-image
      - name: start the stack (server and worker)
        run: docker compose --profile worker up -d --wait --wait-timeout 240 server worker
      - name: wait for readiness
        run: |
          for port in 8080 8081; do
            ok=""
            for _ in $(seq 1 60); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/readyz")" = "200" ]; then ok=1; break; fi
              sleep 2
            done
            [ -n "$ok" ] || { echo "readyz on port ${port} did not return 200 within 2 minutes"; exit 1; }
          done
      - name: bootstrap an API key and prepare a test asset
        run: |
          key="$(docker compose run --rm -T --no-deps server admin bootstrap --tenant-name ci --client-name ci)"
          echo "::add-mask::${key}"
          case "${key}" in cf_*_*) ;; *) echo "bootstrap did not print a key"; exit 1 ;; esac
          echo "CIPHERFRAME_API_KEY=${key}" >> "$GITHUB_ENV"
          export CIPHERFRAME_API_KEY="${key}" FIXTURE_FFMPEG="${PWD}/out/tools/ffmpeg-fixtures"
          echo "CIPHERFRAME_ASSET_ID=$(sh player/e2e/prepare-asset.sh)" >> "$GITHUB_ENV"
      - name: install Chromium
        working-directory: player
        run: pnpm exec playwright install --with-deps chromium
      - name: end-to-end (Chromium against the stack)
        working-directory: player
        run: pnpm e2e
      - name: upload the Playwright trace
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-playwright-trace
          path: player/test-results/
          if-no-files-found: ignore
      - name: compose logs
        if: failure()
        run: docker compose --profile worker logs --no-color
      - name: tear down
        if: always()
        run: docker compose --profile worker down -v

  media:
    name: media (worker image and FFmpeg tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # FFmpeg, x264 and dav1d compile in cached layers (GitHub Actions cache), so only the first
      # run, or a change to the pins in build/worker.Dockerfile, pays for the compile.
      - name: build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/worker.Dockerfile
          load: true
          tags: cipherframe-worker:ci
          cache-from: type=gha,scope=worker-image
          cache-to: type=gha,scope=worker-image,mode=max
      - name: export the test binaries (including the generator FFmpeg)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/worker.Dockerfile
          target: tools
          outputs: type=local,dest=out/tools
          cache-from: type=gha,scope=worker-image
      - name: image has the minimal FFmpeg, the licences and the source offer
        run: |
          docker run --rm --entrypoint /usr/local/bin/ffmpeg cipherframe-worker:ci -hide_banner -buildconf | tee out-buildconf.txt
          grep -q -- '--disable-everything' out-buildconf.txt
          grep -q -- '--disable-network' out-buildconf.txt
          docker image inspect cipherframe-worker:ci --format 'image size: {{.Size}} bytes'
          id="$(docker create cipherframe-worker:ci)"
          mkdir -p out/image
          docker cp "${id}:/usr/local/bin/ffmpeg" out/image/ffmpeg
          docker cp "${id}:/usr/local/bin/ffprobe" out/image/ffprobe
          docker cp "${id}:/usr/share/licenses/ffmpeg" out/licenses
          docker rm "${id}"
          for f in COPYING.GPLv2 COPYING.GPLv3 SOURCE.md x264-COPYING.GPLv2; do test -s "out/licenses/$f"; done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      # The binaries copied out of the image are static, so they run on the runner: put them on PATH
      # and run every package's integration tests with the media tests. Postgres and SeaweedFS
      # start through testcontainers on the runner's Docker. The fixtures come from the test-only
      # generator build (it also has the ssim and psnr filters the pipeline test uses to measure
      # quality; those filters are never in the shipped FFmpeg).
      - name: the image's ffmpeg and ffprobe on PATH
        run: |
          bin="${RUNNER_TEMP}/ffbin"
          mkdir -p "${bin}"
          cp out/image/ffmpeg out/image/ffprobe out/tools/ffmpeg-fixtures "${bin}/"
          chmod +x "${bin}"/*
          echo "${bin}" >> "${GITHUB_PATH}"
      - name: media, pipeline and integration tests against the image's binaries
        env:
          CIPHERFRAME_TEST_FFMPEG_FIXTURES: ${{ runner.temp }}/ffbin/ffmpeg-fixtures
        run: |
          export CIPHERFRAME_TEST_FFMPEG="$(command -v ffmpeg)" CIPHERFRAME_TEST_FFPROBE="$(command -v ffprobe)"
          go test -race -count=1 -tags=integration,media -v ./internal/...

  ml:
    name: ml (ruff and pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The end-to-end masking tests need a system FFmpeg; they skip without one.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: fetch the pinned model (SHA-256 verified)
        run: uv run python scripts/fetch_model.py models
      # Postgres comes from testcontainers on the runner's Docker (ryuk is off, see env above).
      - run: uv run pytest -v

  release-check:
    name: release-check (GoReleaser config and snapshot binaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      # Binaries only: images, signing, SBOMs and publishing run in release.yml.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign,docker,sbom
