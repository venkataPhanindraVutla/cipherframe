{{- range $role := list "api" "edge" "worker" }}
{{- $r := get $.Values $role }}
{{- if $r.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cipherframe.fullname" $ }}-{{ $role }}
  labels:
    {{- include "cipherframe.labels" (dict "root" $ "role" $role) | nindent 4 }}
  {{- with $r.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
