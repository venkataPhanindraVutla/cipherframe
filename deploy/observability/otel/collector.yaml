# OpenTelemetry Collector for the development stack (profile "observability"). Development only.
#
# Receives OTLP traces from api, edge and worker, prints a one-line summary of each batch and writes
# every span as JSON lines to /otel-out/traces.jsonl, which the CI secret scan reads (ADR 0058).
# Metrics are scraped by Prometheus, not pushed, so there is no metrics pipeline.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: basic
  file:
    path: /otel-out/traces.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 2

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file]
