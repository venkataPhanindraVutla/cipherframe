openapi: 3.1.0
info:
  title: Cipherframe API
  version: 0.1.0
  summary: Encrypted video delivery control plane and data plane.
  description: |
    Source of truth for the Cipherframe HTTP API (ADR 0015). Server interfaces and models are
    generated from this file; a contract test fails CI when the running server and this file
    disagree. Paths under /v1/ are added by later tasks.

    Authentication (ADR 0009): `/v1/` operations on the api listener take an API key in
    `Authorization: Bearer cf_<prefix>_<secret>`. Each operation lists the scopes a key needs.
    Health and readiness are unauthenticated.

    Each operation carries a tag naming the listener that serves it: `api` (control plane) or
    `edge` (browser-facing data plane). An operation served by both lists both tags. Upload
    operations on the edge authenticate with an upload token, not an API key (ADR 0025).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Local development, api listener (CIPHERFRAME_API_LISTEN)
  - url: http://localhost:8081
    description: Local development, edge listener (CIPHERFRAME_EDGE_LISTEN)
tags:
  - name: api
    description: Served by the api listener (control plane).
  - name: edge
    description: Served by the edge listener (data plane).
  - name: ops
    description: Health and readiness, served on every listener.
  - name: tus
    description: |
      The tus protocol endpoints that the edge listener mounts from the tusd library. Documented
      here but not generated and not part of route coverage.
security: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      description: |
        Reports that the process is alive. It checks no dependency and is unauthenticated.
      tags: [ops, api, edge]
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness
      description: |
        Runs the dependency checks (database, object storage, job queue) and returns 200 when all
        pass or 503 when any fails. The body lists check names and results only: no hostnames,
        credentials or error text. It is unauthenticated.
      tags: [ops, api, edge]
      responses:
        "200":
          description: Every check passed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: At least one check failed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/whoami:
    get:
      operationId: getWhoami
      summary: Identify the calling key
      description: |
        Returns the tenant, client, key and scopes behind the presented API key. Any valid key may
        call it.
      tags: [api]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's identity.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/clients:
    post:
      operationId: createClient
      summary: Create a client
      description: |
        Creates a client in the caller's tenant. Requires the `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRequest"
      responses:
        "201":
          description: The client was created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listClients
      summary: List clients
      description: |
        Lists the caller's tenant's clients, oldest first, with cursor pagination. Requires the
        `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of clients.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/keys:
    post:
      operationId: createKey
      summary: Create an API key
      description: |
        Creates a key for a client of the caller's tenant (another tenant's client is `not_found`).
        When `scopes` is omitted the key gets every scope except `admin`. The full key is in the
        response once and is never shown again. Requires the `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
      responses:
        "201":
          description: The key was created. `key` holds the full secret, shown only here.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listKeys
      summary: List API keys
      description: |
        Lists the keys of the caller's tenant (revoked ones included), oldest first, with cursor
        pagination. Metadata only: no secret or hash is ever returned. Requires the `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of keys.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/keys/{key_id}/rotate:
    post:
      operationId: rotateKey
      summary: Rotate an API key in place
      description: |
        Replaces the key's secret on the same key row (same id, prefix, client and scopes). The old
        secret keeps working for `overlap_seconds` (default 600, 0 to 86400). The new full key is in
        the response once. A key with the `admin` scope may rotate any key of its tenant; any other
        key may rotate only itself and gets `forbidden` for another key. A revoked key is `not_found`.
      tags: [api]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateKeyRequest"
      responses:
        "200":
          description: The key was rotated. `key` holds the new full secret, shown only here.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/keys/{key_id}/revoke:
    post:
      operationId: revokeKey
      summary: Revoke an API key
      description: |
        Disables the key immediately: its secret, and any still-valid previous secret, stop working
        on the next request. Idempotent. Audit rows remain. Requires the `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          description: The key is revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets:
    post:
      operationId: createAsset
      summary: Create an asset and start an upload
      description: |
        Creates an asset in state `created` and returns where and how to upload its source: the edge
        base URL, a short-lived **upload token** bound to this one asset (shown only in this
        response) and, for `multipart`, the part size. The declared `size_bytes` may not exceed the
        configured maximum source size (default 10 GiB; `payload_too_large` otherwise). No original
        file name is accepted or stored. Requires the `assets:write` scope. Endpoint names and
        shapes are flagged for owner review before v1.0.0 (ADR 0026).
      tags: [api]
      security:
        - bearerAuth: [assets:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: The asset was created. `upload.token` is shown only here.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAsset"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listAssets
      summary: List assets
      description: |
        Lists the caller's tenant's assets (deleted ones excluded), oldest first, with cursor
        pagination. Requires the `assets:read` scope.
      tags: [api]
      security:
        - bearerAuth: [assets:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of assets.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{asset_id}:
    get:
      operationId: getAsset
      summary: Get an asset
      description: |
        Returns one asset. An asset of another tenant, or a deleted one, is `not_found`. Requires
        the `assets:read` scope.
      tags: [api]
      security:
        - bearerAuth: [assets:read]
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: The asset.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{asset_id}/commit:
    post:
      operationId: commitAsset
      summary: Finish the upload and start processing
      description: |
        Ends the upload: a multipart upload is completed from the parts edge received, then the
        source object is checked to exist with exactly the declared size. The asset becomes
        `committed`, its upload token stops working and processing is queued, all in one
        transaction. With tus, the upload must have finished (`conflict` otherwise). Committing an
        asset that is already committed or further along returns it unchanged and queues nothing.
        Requires the `assets:write` scope.
      tags: [api]
      security:
        - bearerAuth: [assets:write]
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: The asset is committed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{asset_id}/abort:
    post:
      operationId: abortAsset
      summary: Abort an upload
      description: |
        Stops an upload that has not been committed. The asset becomes `failed` with
        `failure_code` `upload_aborted`, its upload token stops working, an unfinished multipart
        upload is aborted and every partial object is deleted. Repeating the call repeats the
        cleanup. A committed asset cannot be aborted (`conflict`). Requires the `assets:write`
        scope.
      tags: [api]
      security:
        - bearerAuth: [assets:write]
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: The upload was aborted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{asset_id}/access-log:
    get:
      operationId: getAssetAccessLog
      summary: Read an asset's access trail
      description: |
        Returns the access trail of one asset of the caller's tenant, newest first, with optional
        `from` and `to` (a half-open range on the event time), an `event` filter and cursor
        pagination (`limit` up to 500, default 100). An asset of another tenant, a deleted one and
        an unknown one are all `404`. Requires the `assets:read` scope.

        The trail is **best effort**: under overload or a database outage events are dropped
        rather than slowing playback, so it is an audit aid and not a billing ledger. Rows never
        contain a session ID, a token or the hash of a session ID: `session` is a short
        fingerprint that only lets you group the rows of one session. See `AccessLogEntry` for
        what each event means and what is never recorded.
      tags: [api]
      security:
        - bearerAuth: [assets:read]
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/AccessLogFrom"
        - $ref: "#/components/parameters/AccessLogTo"
        - $ref: "#/components/parameters/AccessLogEvent"
        - $ref: "#/components/parameters/AccessLogLimit"
        - $ref: "#/components/parameters/AccessLogCursor"
      responses:
        "200":
          description: One page of the access trail, newest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessLogList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{asset_id}/manifest:
    get:
      operationId: getAssetManifest
      summary: Get an asset's signed integrity manifest
      description: |
        Returns the asset's signed manifest as the DSSE envelope that is stored (ADR 0033, 0039):
        `payloadType`, the base64 `payload` (the canonical manifest, which includes the `masked`
        section once the masked variant is published) and the `signatures`. Verify it with the
        published keys (`/.well-known/cipherframe-keys.json`). An asset of another tenant, an unknown
        one, one that is not ready and one without a manifest are all `404 not_found`. Requires the
        `assets:read` scope.
      tags: [api]
      security:
        - bearerAuth: [assets:read]
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: |
            The envelope, with `Content-Type: application/vnd.cipherframe.manifest+json;
            profile=dsse`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/vnd.cipherframe.manifest+json:
              schema:
                $ref: "#/components/schemas/DsseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assets/{asset_id}/proof:
    get:
      operationId: getAssetProof
      summary: Get an inclusion proof for one artifact
      description: |
        Returns the two-level inclusion proof of one artifact, identified by its manifest `path`
        (relative to the variant's HLS prefix, for example `720p/seg-0.m4s`). An init or media
        segment is proven in its rendition's tree and that tree's root in the top-level tree; a
        playlist (`master.m3u8`, `<rendition>/playlist.m3u8`) only in the top-level tree, so the
        rendition members are absent. The proof is computed from the signed manifest, not from
        storage. See `docs/integrity.md` for how to check it.

        An unknown `path`, an asset of another tenant, a deleted or not ready asset and an asset
        without a manifest are `404` (`artifact_not_found` for the path, `not_found` otherwise).
        `variant=masked` on an asset created without `mask_faces` is `409 variant_unavailable`, and
        on one whose masked variant is not published yet `409 variant_not_ready`. Requires the
        `assets:read` scope.
      tags: [api]
      security:
        - bearerAuth: [assets:read]
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - name: path
          in: query
          required: false
          description: |
            The artifact's manifest path. Required: it is declared optional only so that the
            api key is checked before the parameters (a missing `path` is `400 invalid_request`).
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: variant
          in: query
          required: false
          description: The variant to prove (default `original`).
          schema:
            $ref: "#/components/schemas/ArtifactVariant"
      responses:
        "200":
          description: The proof.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InclusionProof"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/verify:
    post:
      operationId: verifyArtifact
      summary: Is this file ours?
      description: |
        Answers whether a file's SHA-256 matches what Cipherframe signed, without the file ever
        reaching the server: the caller hashes it locally. The answer is always `200` with an
        `outcome` (ADR 0039):

        - `ours`: the artifact is in the asset's signed manifest and the hash matches. The response
          carries its `proof`.
        - `modified`: the `path` is in the signed manifest but the hash differs, so the file claims
          to be an artifact of ours but is not byte-identical.
        - `cannot_say`: anything else (no such asset, path or variant for this tenant, an asset
          that is not ready, a hash that matches nothing, a stored manifest whose signature does
          not verify). It never means "modified", and it is never a verdict that something is
          fake.

        With `asset_id` and `path` (and optionally `variant`, default `original`) the hash is
        compared with that artifact. With only `sha256` the tenant's registered artifacts are
        searched: `ours` with where the hash belongs (`asset_id`, `variant`, manifest `path`), or
        `cannot_say`; a hash alone can never prove `modified`. Giving only one of `asset_id` and
        `path`, or `variant` without them, is `400`. The signature of the stored manifest is
        checked against the published signing keys on every call. Requires the `assets:read` scope.
      tags: [api]
      security:
        - bearerAuth: [assets:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: The verdict.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/playback-sessions:
    post:
      operationId: createPlaybackSession
      summary: Start a playback session
      description: |
        Starts a playback session for one viewer on one `ready` asset of the caller's tenant and
        returns what the viewer's player needs: the session ID, a short-lived **playback token**
        (shown only in this response), the heartbeat interval and the master playlist URL on edge
        (ADR 0028, 0030). Requires the `sessions:write` scope.

        An asset of another tenant is `not_found`, the same as one that does not exist. An asset
        that is not `ready` is `409 asset_not_ready`. A viewer that already has the tenant's
        maximum number of active sessions (default 3, `max_sessions_per_viewer` in the playback
        settings; 0 means unlimited) gets `409 session_limit`, and existing sessions are left
        alone. The session is bound to one `variant` (see the request); asking for one the asset
        does not have is `409 variant_unavailable`, and for a masked variant that is not ready yet
        `409 variant_not_ready`. A session counts as active until it is revoked or ended, until it has had no
        heartbeat for the idle timeout, or until it reaches its maximum age.

        `viewer_id` is yours to choose. Use a pseudonymous identifier that only your application
        can link to a person. Never send an email address, a name or another direct identifier: it
        is stored with the session and counts against the viewer's session limit.

        The player sends the token as `Authorization: Bearer <token>` on every request to edge
        (`token_transport` is `header`). When the tenant has set `token_in_url`, `manifest_url`
        carries the token as the query parameter `t` and `token_transport` is `url`; that mode is
        for native HLS players that cannot set headers, and the token can then appear in browser
        history and in logs of proxies the operator does not control (ADR 0030).
      tags: [api]
      security:
        - bearerAuth: [sessions:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaybackSessionRequest"
      responses:
        "201":
          description: The session was created. `token` and a `manifest_url` carrying it are shown only here.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPlaybackSession"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/playback-sessions/revoke:
    post:
      operationId: revokePlaybackSessions
      summary: Revoke sessions by filter
      description: |
        Revokes every active session of the caller's tenant that matches the filter: `viewer_id`,
        `asset_id`, or both (both must match). At least one is required; an empty filter is `400`
        (a tenant-wide revoke is deliberately not possible). Sessions of other tenants are never
        touched. Returns how many sessions it revoked, which is 0 when none matched. Sessions
        already ended or revoked are left as they are. Requires the `sessions:write` scope, and is
        recorded in the audit log.

        Revocation takes effect at once for playlists, the key and heartbeats. Segments already
        covered by an issued token keep working until that token expires (at most the token
        lifetime, 10 minutes by default), but cannot be decrypted without the key.
      tags: [api]
      security:
        - bearerAuth: [sessions:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokePlaybackSessionsRequest"
      responses:
        "200":
          description: The matching sessions were revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedPlaybackSessions"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/playback-sessions/{session_id}:
    get:
      operationId: getPlaybackSession
      summary: Get a playback session
      description: |
        Returns the status of one session of the caller's tenant. It never returns a token. A
        session of another tenant is `404`, the same as an unknown one. Requires the
        `sessions:write` scope.

        `state` is `active`, `ended` or `revoked`. A session that is still `active` in storage but
        has been idle past the tenant's idle timeout, or has reached its maximum age, is reported
        as `ended` (with `ended_at` null until the background sweep records it), because it can
        no longer be used.
      tags: [api]
      security:
        - bearerAuth: [sessions:write]
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: The session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSessionStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/playback-sessions/{session_id}/revoke:
    post:
      operationId: revokePlaybackSession
      summary: Revoke a playback session
      description: |
        Revokes one session of the caller's tenant, with an optional `reason` (at most 200
        printable characters; do not put personal data in it: it is stored with the session and
        shown by `getPlaybackSession`). A session of another tenant is `404`, the same as an unknown
        one. Requires the `sessions:write` scope, and is recorded in the audit log.

        The call is idempotent and returns the session's status. Revoking an already revoked
        session changes nothing and keeps its first reason (`200`). Revoking a session that has
        already **ended** also succeeds (`200`) and leaves it `ended`: the record keeps how it
        really finished, and an ended session cannot be used anyway.

        Revocation takes effect at once for playlists, the key and heartbeats. Segments already
        covered by an issued token keep working until that token expires (at most the token
        lifetime, 10 minutes by default), but cannot be decrypted without the key.
      tags: [api]
      security:
        - bearerAuth: [sessions:write]
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokePlaybackSessionRequest"
      responses:
        "200":
          description: The session after the call.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSessionStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/playback-sessions/{session_id}/access-log:
    get:
      operationId: getPlaybackSessionAccessLog
      summary: Read a playback session's access trail
      description: |
        Returns the access trail of one session of the caller's tenant: the same rows and filters
        as `getAssetAccessLog`, for one session. A session of another tenant is `404`, the same as
        an unknown one. Requires the `assets:read` scope.
      tags: [api]
      security:
        - bearerAuth: [assets:read]
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/AccessLogFrom"
        - $ref: "#/components/parameters/AccessLogTo"
        - $ref: "#/components/parameters/AccessLogEvent"
        - $ref: "#/components/parameters/AccessLogLimit"
        - $ref: "#/components/parameters/AccessLogCursor"
      responses:
        "200":
          description: One page of the access trail, newest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessLogList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/playback-events:
    get:
      operationId: listPlaybackEvents
      summary: List playback anomaly events
      description: |
        Returns the anomaly events raised for the caller's tenant, newest first, with optional
        `kind`, `asset_id` and `viewer_id` filters, a half-open `from`/`to` range on the event
        time, and cursor pagination (`limit` up to 500, default 100). Requires the `assets:read`
        scope.

        An event is a signal, not a verdict: see `PlaybackEventKind` for what each one means and
        for what it cannot catch. Events are written by edge and the API as they are detected,
        once per session (or viewer) and kind per 10 minutes, and `segments_without_key` once per
        session. They carry no session ID, token or address: `session` is the same 8-character
        fingerprint the access log uses.

        Webhook delivery of events arrives with milestone M7; until then this endpoint is the way
        to read them.
      tags: [api]
      security:
        - bearerAuth: [assets:read]
      parameters:
        - $ref: "#/components/parameters/PlaybackEventKindQuery"
        - $ref: "#/components/parameters/PlaybackEventAssetId"
        - $ref: "#/components/parameters/PlaybackEventViewerId"
        - $ref: "#/components/parameters/AccessLogFrom"
        - $ref: "#/components/parameters/AccessLogTo"
        - $ref: "#/components/parameters/AccessLogLimit"
        - $ref: "#/components/parameters/AccessLogCursor"
      responses:
        "200":
          description: One page of events, newest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackEventList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/playback-settings:
    get:
      operationId: getPlaybackSettings
      summary: Get the playback settings
      description: |
        Returns the tenant's effective playback settings: the stored ones, or the defaults of
        ADR 0028 when none were ever stored (then `updated_at` is absent). Requires the `admin`
        scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      responses:
        "200":
          description: The effective settings.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updatePlaybackSettings
      summary: Replace the playback settings
      description: |
        Replaces every setting of the tenant (a full replacement, not a patch: send all fields).
        Invalid values are `invalid_request` with an `errors` entry per field and nothing is
        stored. The new values apply to sessions created afterwards; sessions that already exist
        keep the limits they were created with, except that the idle timeout and the per-viewer
        limit are read at each new session creation. Requires the `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackSettingsInput"
      responses:
        "200":
          description: The settings were replaced.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/privacy-settings:
    get:
      operationId: getPrivacySettings
      summary: Get the privacy settings
      description: |
        Returns the tenant's effective privacy settings: the stored ones, or the defaults when
        none were ever stored (then `updated_at` is absent). The defaults are the most private
        choice: nothing about the viewer's connection is stored. Gate P11 will set the final
        defaults and add fields (retention, original file names). Requires the `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      responses:
        "200":
          description: The effective settings.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacySettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updatePrivacySettings
      summary: Replace the privacy settings
      description: |
        Replaces every privacy setting of the tenant (a full replacement: send all fields; a
        missing one is `invalid_request` with an `errors` entry naming it). The change is recorded
        in the audit log and applies to access-trail rows written afterwards (each edge replica
        caches the settings for up to 30 seconds). Rows already written are not rewritten.
        Requires the `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacySettingsInput"
      responses:
        "200":
          description: The settings were replaced.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacySettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/playback-auth:
    get:
      operationId: getPlaybackAuth
      summary: Get the playback authorization settings
      description: |
        Returns how the tenant lets a viewer's browser start a playback session without your API
        key (ADR 0029, 0031): the JWT provider (issuer, audiences, JWKS URL, viewer claim, and the
        public keys you uploaded) and the signed-callback provider (URL, and whether a secret
        exists). A tenant that never configured them has both methods off. **The callback secret
        is never returned**; only `callback_secret_version` and whether it is set. Requires the
        `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      responses:
        "200":
          description: The effective settings.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackAuth"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updatePlaybackAuth
      summary: Replace the playback authorization settings
      description: |
        Replaces the JWT and callback settings (a full replacement: a field you leave out goes back
        to its default). It does not touch the uploaded keys or the callback secret; use the
        endpoints below. Invalid values are `invalid_request` with an `errors` entry per field and
        nothing is stored. `callback_enabled` needs a callback secret (rotate one first) and
        `jwt_enabled` needs a `jwt_jwks_url` or at least one uploaded key. Every change is audited.
        Edge reads these settings through a cache of about 30 seconds. Requires the `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackAuthInput"
      responses:
        "200":
          description: The settings were replaced.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackAuth"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/playback-auth/jwt-keys/{kid}:
    put:
      operationId: putPlaybackJwtKey
      summary: Upload a public JWT verification key
      description: |
        Stores a **public** JWK under `kid`, replacing a key that has the same `kid`. The body is the
        JWK itself and must carry `alg`. Edge uses a key only with that algorithm. Refused with
        `invalid_request`: a private key (any private member such as `d`), an RSA key under 2048
        bits, an EC curve other than P-256, a key type other than OKP (Ed25519), EC and RSA, an
        `alg` that is not `EdDSA`, `ES256` or `RS256` or does not match the key, `use` other than
        `sig`, and a `kid` member that differs from the path. A tenant may hold at most 20 keys
        (`409 conflict` beyond that). Every change is audited. Requires the `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/KidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicJwk"
      responses:
        "200":
          description: The key was stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackJwtKey"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePlaybackJwtKey
      summary: Delete an uploaded JWT verification key
      description: |
        Deletes the uploaded key with this `kid`. Tokens signed with it stop verifying once edge's
        settings cache (about 30 seconds) expires. An unknown `kid` is `404 not_found`. Audited.
        Requires the `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/KidPath"
      responses:
        "204":
          description: The key was deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/playback-auth/callback-secret/rotate:
    post:
      operationId: rotatePlaybackCallbackSecret
      summary: Rotate the callback signing secret
      description: |
        Generates a new 32-byte callback secret and returns it **once** as `whsec_<base64>`, the form
        Standard Webhooks libraries take. Cipherframe stores it wrapped by the key provider and
        cannot show it again. For 24 hours after a rotation the previous secret keeps signing too:
        every callback then carries two signatures in `webhook-signature`, so your endpoint can
        switch secrets without refusing a viewer. The first rotation has no previous secret. Audited.
        Requires the `admin` scope. The response is `no-store`.
      tags: [api]
      security:
        - bearerAuth: [admin]
      responses:
        "200":
          description: The new secret. It is shown only here.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatedCallbackSecret"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/signing-keys:
    get:
      operationId: listSigningKeys
      summary: List the integrity signing keys
      description: |
        Lists every integrity signing key of the deployment, oldest first: the one `current` key
        that signs, the older `active` keys that still verify, and the `retired` keys that are
        published only so old records verify. The keys are deployment-wide, not per tenant. Only
        public keys are returned; the private half never leaves Cipherframe. Requires the `admin`
        scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      responses:
        "200":
          description: The signing keys.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKeyList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/signing-keys/rotate:
    post:
      operationId: rotateSigningKey
      summary: Rotate the integrity signing key
      description: |
        Creates a new signing key and makes it the current one. The previous key stays `active`:
        it is still published and still verifies, and it stops signing. The new key is generated by
        Cipherframe and stored wrapped by the key provider. If the key provider is unavailable the
        call fails with `dependency_unavailable` and no key is created. Audited. Requires the
        `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      responses:
        "201":
          description: The new current key.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKey"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/signing-keys/{key_id}/retire:
    post:
      operationId: retireSigningKey
      summary: Retire a signing key
      description: |
        Marks a key `retired`. It stays published with `status: retired`, so records it signed still
        verify, and it never signs again. The current key cannot be retired (`conflict`): rotate
        first. Retiring a retired key changes nothing. Audited. Requires the `admin` scope.
      tags: [api]
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/SigningKeyIdPath"
      responses:
        "200":
          description: The key, retired.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKey"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /.well-known/cipherframe-keys.json:
    get:
      operationId: getSigningKeySet
      summary: The public signing key set
      description: |
        The public keys that verify Cipherframe's integrity manifests and deletion records
        (ADR 0033). A verifier needs only this document, never a secret. Every key is listed, each
        with a `status`: `active` keys verify and one of them signs, `retired` keys verify old
        records and never sign. Keys are ordered by creation time. The set is the same for every
        tenant. It is public, needs no authentication, allows any origin (CORS `*`) and may be
        cached for five minutes. A change reaches it within a minute.
      tags: [api, edge]
      security: []
      responses:
        "200":
          description: The key set.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPublic"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AccessControlAllowOriginAny"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKeySet"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/play/tenants/{tenant_id}/sessions:
    post:
      operationId: createBrowserPlaybackSession
      summary: Start a playback session from the viewer's browser
      description: |
        The viewer's browser starts its own playback session, authorised by your application with a
        JWT or a signed callback (ADR 0029, 0031) instead of your API key. The tenant is in the path
        because a CORS preflight has no body: the preflight `OPTIONS` on this path needs no
        credentials and answers `204` (with `Access-Control-Allow-Origin` only for an origin in the
        tenant's `allowed_origins`). Every response carries `Cache-Control: no-store`.

        **`method: "jwt"`** takes the token in `Authorization: Bearer <jwt>`. It is checked against
        the keys you uploaded or your JWKS: algorithms `EdDSA`, `ES256` and `RS256` only; `iss` equal
        to the configured issuer; `aud` containing a configured audience; `exp` required (at most
        60 seconds of clock skew, and no more than 24 hours ahead); `nbf` and `iat` honoured; `jti`
        required (at most 128 characters) and **single use**; `asset_id` equal to the asset in the
        body, so one token cannot open every asset; and the configured viewer claim (default `sub`)
        as the viewer ID. An optional `variant` claim (`original` or `masked`) says which variant
        this viewer may play; without it the asset's default applies.

        **`method: "callback"`** sends `ticket`, an opaque string from your page (1 to 2048 bytes),
        to your callback URL in a signed POST. Only an HTTP 200 answer `{"allow": true,
        "viewer_id": "..."}` creates a session. A timeout (2 seconds), any other status, a malformed
        answer or `allow: false` is a `401`. Answers are not cached. The request body names the
        `variant` the session would get, so your application approves that specific variant.

        The viewer never chooses the variant. A `variant` in the request body that differs from the
        one your JWT claim or the asset's default decides is `403`.

        A method that is off, a tenant with nothing configured, and every JWT or callback failure
        answer the same generic `401`, so the response reveals nothing about why. When Cipherframe
        itself cannot unwrap the callback secret the answer is `503`, never a denial. Once
        authorised, the session is created exactly as by `createPlaybackSession` (same asset checks,
        per-viewer limit and response) and counts toward the same per-viewer limit.
      tags: [edge]
      security:
        - {}
        - viewerJwt: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrowserPlaybackSessionRequest"
      responses:
        "201":
          description: The session was created. `token` and a `manifest_url` carrying it are shown only here.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPlaybackSession"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/ViewerUnauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/play/{session_id}/master.m3u8:
    get:
      operationId: getPlaybackMaster
      summary: Session master playlist
      description: |
        The master playlist of the session's asset, rewritten for this session (ADR 0027, 0030):
        each variant URI is `<rendition>/media.m3u8`, relative to the session path. Requires a
        playback token with the `manifest` scope (see `playbackToken`). Unlike segments, a playlist
        request also checks the session row: a session that is revoked, ended, past its maximum age
        or idle past the idle timeout answers `401`, the same as a bad token, so the status does not
        reveal why.

        When the tenant has `token_in_url` on, every URI in the playlist carries `?t=<token>`;
        otherwise none does. The response is `no-store` and carries `Referrer-Policy: no-referrer`.

        **CORS.** A browser origin listed in the tenant's `allowed_origins` (exact match) gets
        `Access-Control-Allow-Origin` with that origin and `Vary: Origin`; any other origin gets no
        CORS headers. The preflight `OPTIONS` request on this path and on the two below needs no
        token and answers `204` with `Access-Control-Allow-Methods: GET, POST, OPTIONS` and
        `Access-Control-Allow-Headers: Authorization`, for an allowed origin only. Credentials are
        never allowed.
      tags: [edge]
      security:
        - playbackToken: []
      parameters:
        - $ref: "#/components/parameters/PlaySessionId"
        - $ref: "#/components/parameters/PlayTokenQuery"
      responses:
        "200":
          description: The rewritten master playlist.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Referrer-Policy:
              $ref: "#/components/headers/ReferrerPolicyNoReferrer"
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/PlaybackUnauthenticated"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/play/{session_id}/{rendition}/media.m3u8:
    get:
      operationId: getPlaybackMedia
      summary: Session media playlist
      description: |
        The media playlist of one rendition, rewritten for this session: the init segment and
        every media segment are file names relative to the rendition, and the key URI is
        `../key`, which is `/v1/play/<session_id>/key` (`getPlaybackKey`). Requires a token
        with the `manifest` scope and the same session check as the master playlist. The same
        `token_in_url` and CORS rules apply.

        When the tenant's `delivery` is `presigned` (ADR 0032), the init segment URI and every media
        segment URI are absolute presigned storage URLs instead (never with `?t=`); the key URI
        is unchanged. A URL expires with the playback token or after 10 minutes, whichever is
        first. A token with under a second left is answered `401`. The URLs are credentials until
        they expire and are never logged by edge.
      tags: [edge]
      security:
        - playbackToken: []
      parameters:
        - $ref: "#/components/parameters/PlaySessionId"
        - $ref: "#/components/parameters/PlayRendition"
        - $ref: "#/components/parameters/PlayTokenQuery"
      responses:
        "200":
          description: The rewritten media playlist.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Referrer-Policy:
              $ref: "#/components/headers/ReferrerPolicyNoReferrer"
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/PlaybackUnauthenticated"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/play/{session_id}/{rendition}/{file}:
    get:
      operationId: getPlaybackSegment
      summary: Init or media segment
      description: |
        Streams the rendition's init segment (`init.mp4`, `video/mp4`) or one encrypted media
        segment (`seg-<n>.m4s`, `video/iso.segment`) from the delivery bucket, with `Content-Length`.
        Requires a token with the `segment` scope. This path is stateless: it checks the token (MAC,
        expiry, scope, session) and never reads the session row, so a revoked session can still
        fetch segments until its token expires; the content stays unreadable without the key
        (ADR 0028). The asset comes from the token, never from the request. `file` outside the two
        shapes, or a rendition or segment that does not exist, is `404`.
      tags: [edge]
      security:
        - playbackToken: []
      parameters:
        - $ref: "#/components/parameters/PlaySessionId"
        - $ref: "#/components/parameters/PlayRendition"
        - $ref: "#/components/parameters/PlayFile"
        - $ref: "#/components/parameters/PlayTokenQuery"
      responses:
        "200":
          description: The segment bytes.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              description: "Always `private, max-age=300`: the bytes are immutable and useless without the key."
              required: true
              schema:
                type: string
                enum: ["private, max-age=300"]
            Referrer-Policy:
              $ref: "#/components/headers/ReferrerPolicyNoReferrer"
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/iso.segment:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/PlaybackUnauthenticated"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/play/{session_id}/key:
    get:
      operationId: getPlaybackKey
      summary: Content key
      description: |
        Returns the 16-byte AES-128 content key of the session's asset, as raw bytes: the URI of
        the `EXT-X-KEY` tag in every media playlist (`../key`). Requires a token with the `key`
        scope. Unlike segments, this path **always** reads the session row (never cached): a
        session that is revoked, ended, past its maximum age or idle past the idle timeout answers
        `401` on the next request, the same as a bad token. An asset that is no longer `ready`, or
        whose content key has been destroyed, is the same `401`. If the key service or the database
        is unavailable the answer is `503 dependency_unavailable`, never `401` or `404` (I11).

        **Bounds** (ADR 0028; the tenant's `key_fetches_per_token` and `key_requests_per_minute`,
        enforced in the database, so they hold across replicas). Each key request counts toward the
        session's fixed one-minute window, rejected ones included, so hammering stays capped. At
        most `key_fetches_per_token` *successful* key responses are given for one token; a failed
        key lookup does not use one up. Past either bound the answer is `429 rate_limited` with
        `Retry-After`, and one anomaly event is recorded for the token or the window. After the
        per-token bound, `Retry-After` is the heartbeat interval: ask for a new token (heartbeat)
        and try again.

        The response is `no-store, private` with `Pragma: no-cache` and
        `Referrer-Policy: no-referrer`. **CORS** and the `t` parameter follow the other playback
        routes (exact `allowed_origins` match; `t` only with `token_in_url`). The preflight needs no
        token.
      tags: [edge]
      security:
        - playbackToken: []
      parameters:
        - $ref: "#/components/parameters/PlaySessionId"
        - $ref: "#/components/parameters/PlayTokenQuery"
      responses:
        "200":
          description: The raw 16-byte content key.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              description: "Always `no-store, private`."
              required: true
              schema:
                type: string
                enum: ["no-store, private"]
            Pragma:
              description: Always `no-cache`.
              required: true
              schema:
                type: string
                enum: [no-cache]
            Referrer-Policy:
              $ref: "#/components/headers/ReferrerPolicyNoReferrer"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/PlaybackUnauthenticated"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          description: |
            The token has used its key fetches, or the session has made too many key requests in
            the current minute. `Retry-After` says when to try again.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Retry-After:
              description: Seconds to wait, at least 1.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/play/{session_id}/heartbeat:
    post:
      operationId: heartbeatPlayback
      summary: Heartbeat
      description: |
        Keeps a session alive and returns a fresh playback token (ADR 0028). The player calls it
        every `heartbeat_interval_seconds` and uses the new token for every later request to edge,
        playlists, key and segments alike. Requires a token with the `manifest` scope (any token
        the session was given); the token, its transport (`Authorization` header, or `t` when the
        tenant allows it) and CORS follow the other playback routes. The body is empty.

        In one atomic step edge records the heartbeat, only when the session is still usable:
        active, before its maximum age and not idle (judged on the **previous** heartbeat). An
        unusable session, whether revoked, ended, expired, idle or unknown, answers the same
        generic `401` as a bad token. A heartbeat that follows the previous one by less than the
        larger of a quarter of the heartbeat interval and 5 seconds is a `429 rate_limited` with
        `Retry-After` and changes nothing, so a script cannot mint tokens in a tight loop.

        The new token carries all three scopes and expires at the earlier of the token lifetime
        from now and `session_expires_at`. The token it replaces keeps working until its own expiry
        (tokens are stateless); only a revocation or the end of the session stops the session
        itself. The response is `no-store`.
      tags: [edge]
      security:
        - playbackToken: []
      parameters:
        - $ref: "#/components/parameters/PlaySessionId"
        - $ref: "#/components/parameters/PlayTokenQuery"
      responses:
        "200":
          description: The heartbeat was recorded. `token` is shown only here and replaces the previous one.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Referrer-Policy:
              $ref: "#/components/headers/ReferrerPolicyNoReferrer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackHeartbeat"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/PlaybackUnauthenticated"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          description: The previous heartbeat was too recent. `Retry-After` says when to try again.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Retry-After:
              description: Seconds to wait, at least 1.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/play/{session_id}/end:
    post:
      operationId: endPlayback
      summary: End the session
      description: |
        The player calls this when the viewer closes it or the page unloads (`navigator.sendBeacon`
        cannot set headers, so use `fetch` with `keepalive: true` and the `Authorization` header).
        An active session becomes `ended` and stops counting toward the viewer's session limit.
        Requires a token with the `manifest` scope, but, unlike the playlists, the session need not
        be usable: the call is idempotent, so ending a session that is already ended, idle,
        expired or revoked is a `204` too (a revoked session stays revoked). A bad token is the
        generic `401`. The body is empty.
      tags: [edge]
      security:
        - playbackToken: []
      parameters:
        - $ref: "#/components/parameters/PlaySessionId"
        - $ref: "#/components/parameters/PlayTokenQuery"
      responses:
        "204":
          description: The session is ended (or was not active).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/PlaybackUnauthenticated"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/uploads/multipart/{asset_id}/parts:
    get:
      operationId: listUploadParts
      summary: List received parts
      description: |
        Lists the parts edge has stored for this upload, so an interrupted client can send only
        the missing ones. Authenticated with the upload token, never an API key.
      tags: [edge]
      security:
        - uploadToken: []
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: The received parts, in ascending order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/uploads/multipart/{asset_id}/parts/{part_number}:
    put:
      operationId: putUploadPart
      summary: Upload one part
      description: |
        Streams one part of a multipart upload through edge into the object store. `Content-Length`
        is required and may not exceed the part size from the create response. Every part but the
        last must be at least 5 MiB. Sending a part again replaces it. Authenticated with the
        upload token, never an API key.
      tags: [edge]
      security:
        - uploadToken: []
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - name: part_number
          in: path
          required: true
          description: The part number, 1 to 10000.
          schema:
            type: integer
            minimum: 1
            maximum: 10000
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The part was stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPart"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/uploads/tus/:
    post:
      operationId: createTusUpload
      summary: Start the tus upload (tus protocol, mounted)
      description: |
        The tus 1.0.0 creation request, served by the tusd library mounted on the edge listener
        and **not generated from this file**: it has the `tus` tag, so it is documented here but
        excluded from the generated server and from route coverage. `Upload-Length` must equal the
        asset's `size_bytes`; `Upload-Metadata` is ignored (no file name is kept). One upload per
        asset: a second creation is `409`. Authenticated with the upload token. The `Location`
        header carries the asset ID, never an object key. Termination, concatenation and deferred
        length are disabled; abort through the API.
      tags: [tus]
      security:
        - uploadToken: []
      responses:
        "201":
          description: The upload was created. `Location` is the upload URL.
        "400":
          description: Missing or wrong `Upload-Length`.
        "401":
          description: The upload token is missing, invalid or expired.
        "409":
          description: An upload was already started for this asset, or the asset is not a tus asset.
  /v1/uploads/tus/{asset_id}:
    head:
      operationId: headTusUpload
      summary: Read the tus upload offset (tus protocol, mounted)
      description: |
        The tus offset request, served by tusd (not generated). Returns `Upload-Offset` so an
        interrupted client resumes there. Authenticated with the upload token.
      tags: [tus]
      security:
        - uploadToken: []
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: The current offset in `Upload-Offset`.
        "401":
          description: The upload token is missing, invalid or expired.
        "404":
          description: No such upload.
    patch:
      operationId: patchTusUpload
      summary: Send a chunk (tus protocol, mounted)
      description: |
        The tus chunk request (`Content-Type: application/offset+octet-stream`), served by tusd
        (not generated). Authenticated with the upload token.
      tags: [tus]
      security:
        - uploadToken: []
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "204":
          description: The chunk was stored; the new offset is in `Upload-Offset`.
        "401":
          description: The upload token is missing, invalid or expired.
        "404":
          description: No such upload.
        "409":
          description: The offset does not match the server's.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Cipherframe API key (cf_<prefix>_<secret>)
      description: |
        An API key (ADR 0009) in `Authorization: Bearer cf_<prefix>_<secret>`. The scheme name is
        case-insensitive. The scopes listed on an operation are all required.
    uploadToken:
      type: http
      scheme: bearer
      bearerFormat: Cipherframe upload token (cfu_<43 characters>)
      description: |
        A short-lived upload token (ADR 0025) in `Authorization: Bearer cfu_...`, issued by
        `createAsset`. It is bound to one asset, stored hashed, checked against the database on
        every request and refused after its expiry, after commit and after abort. API keys are never
        accepted on upload endpoints.
    playbackToken:
      type: http
      scheme: bearer
      bearerFormat: Cipherframe playback token (v1.<payload>.<kid>.<mac>)
      description: |
        A playback token (ADR 0028, 0030) from `createPlaybackSession`, checked statelessly: MAC,
        expiry, scope and session. It goes in `Authorization: Bearer <token>`. Only when the tenant
        has `token_in_url` on may it go in the query parameter `t` instead, for native HLS players
        that cannot set headers. Sending it both ways is `400 invalid_request`; sending it in the
        query when the setting is off is `401`. Any token failure is the same `401`.
    viewerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT issued by the embedding application
      description: |
        Only for `createBrowserPlaybackSession` with `method: jwt` (ADR 0029, 0031): a JWT your
        application signs, in `Authorization: Bearer <jwt>`, verified against the tenant's uploaded
        keys or JWKS. The `callback` method needs no header.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 100 (default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page. Treat it as opaque.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    AccessLogFrom:
      name: from
      in: query
      required: false
      description: Only events at or after this time (RFC 3339).
      schema:
        type: string
        format: date-time
    AccessLogTo:
      name: to
      in: query
      required: false
      description: Only events before this time (RFC 3339). Must be after `from`.
      schema:
        type: string
        format: date-time
    AccessLogEvent:
      name: event
      in: query
      required: false
      description: Only events of this kind.
      schema:
        $ref: "#/components/schemas/AccessLogEvent"
    AccessLogLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 500 (default 100).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    AccessLogCursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page. Treat it as opaque.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PlaybackEventKindQuery:
      name: kind
      in: query
      required: false
      description: Only events of this kind.
      schema:
        $ref: "#/components/schemas/PlaybackEventKind"
    PlaybackEventAssetId:
      name: asset_id
      in: query
      required: false
      description: Only events about this asset (`ast_` followed by 26 characters).
      schema:
        type: string
        maxLength: 64
    PlaybackEventViewerId:
      name: viewer_id
      in: query
      required: false
      description: Only events about this viewer ID.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AssetId:
      name: asset_id
      in: path
      required: true
      description: An asset ID (`ast_` followed by 26 characters).
      schema:
        type: string
        maxLength: 64
    PlaySessionId:
      name: session_id
      in: path
      required: true
      description: A session ID (`ses_` followed by 52 characters). It grants nothing without a token.
      schema:
        $ref: "#/components/schemas/SessionId"
    SessionIdPath:
      name: session_id
      in: path
      required: true
      description: A session ID (`ses_` followed by 52 characters), as returned by `createPlaybackSession`.
      schema:
        $ref: "#/components/schemas/SessionId"
    KidPath:
      name: kid
      in: path
      required: true
      description: A JWT key ID, 1 to 128 characters from letters, digits and `._~:-`.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._~:-]{1,128}$"
    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      description: Your tenant ID (`ten_` followed by 26 characters). An identifier, not a secret.
      schema:
        type: string
        pattern: "^ten_[0-9a-hjkmnp-tv-z]{26}$"
    PlayRendition:
      name: rendition
      in: path
      required: true
      description: A rendition name from the master playlist, 1 to 16 characters from `[a-z0-9_]`.
      schema:
        type: string
        pattern: "^[a-z0-9_]{1,16}$"
    PlayFile:
      name: file
      in: path
      required: true
      description: "`init.mp4` or `seg-<n>.m4s` with `<n>` a number without leading zeros."
      schema:
        type: string
        pattern: "^(init\\.mp4|seg-(0|[1-9][0-9]{0,8})\\.m4s)$"
    PlayTokenQuery:
      name: t
      in: query
      required: false
      description: |
        The playback token, accepted only when the tenant has `token_in_url` on (ADR 0030). Never
        sent together with `Authorization`.
      schema:
        type: string
        maxLength: 1024
    KeyId:
      name: key_id
      in: path
      required: true
      description: An API key ID (`key_` followed by 26 characters).
      schema:
        type: string
        maxLength: 64
    SigningKeyIdPath:
      name: key_id
      in: path
      required: true
      description: A signing key ID (`sk_` followed by 26 characters).
      schema:
        type: string
        maxLength: 64
  headers:
    XRequestId:
      description: |
        The request ID (UUIDv7). A valid UUID sent by the caller in X-Request-Id is echoed;
        otherwise the server generates one.
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    CacheControlNoStore:
      description: "Always `no-store`; the body holds a full API key, an upload token or a playback token."
      required: true
      schema:
        type: string
        enum: [no-store]
    CacheControlPublic:
      description: Always `public, max-age=300`; the body is public data.
      required: true
      schema:
        type: string
        enum: ["public, max-age=300"]
    AccessControlAllowOriginAny:
      description: Always `*`; the body is public data and carries no credentials.
      required: true
      schema:
        type: string
        enum: ["*"]
    ReferrerPolicyNoReferrer:
      description: Always `no-referrer`, so a token in a URL cannot leak through `Referer`.
      required: true
      schema:
        type: string
        enum: [no-referrer]
  responses:
    Unauthenticated:
      description: |
        The API key is missing, malformed, unknown, revoked or expired. One generic detail covers
        every case.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        WWW-Authenticate:
          description: Always `Bearer`.
          required: true
          schema:
            type: string
            enum: [Bearer]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PlaybackUnauthenticated:
      description: |
        The playback token is missing, malformed, invalid, expired, for another session or without
        the scope the request needs; the token was sent in the query while `token_in_url` is off; or
        (playlists and the key only) the session is no longer active. One generic detail covers every case.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        WWW-Authenticate:
          description: Always `Bearer`.
          required: true
          schema:
            type: string
            enum: [Bearer]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ViewerUnauthenticated:
      description: |
        The method is off or not configured, or the JWT or the callback refused the viewer. One
        generic detail covers every case.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        WWW-Authenticate:
          description: Always `Bearer`.
          required: true
          schema:
            type: string
            enum: [Bearer]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem:
      description: An error, as an RFC 9457 problem details object.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Scope:
      type: string
      description: An API key scope (ADR 0009).
      enum: [assets:read, assets:write, sessions:write, webhooks:manage, admin]
    Name:
      type: string
      minLength: 1
      maxLength: 100
      description: A human-readable name, 1 to 100 characters, no control characters.
    ClientId:
      type: string
      pattern: "^cli_[0-9a-hjkmnp-tv-z]{26}$"
    Whoami:
      type: object
      additionalProperties: false
      required: [tenant_id, client_id, key_id, scopes]
      properties:
        tenant_id:
          type: string
          pattern: "^ten_[0-9a-hjkmnp-tv-z]{26}$"
        client_id:
          $ref: "#/components/schemas/ClientId"
        key_id:
          type: string
          pattern: "^key_[0-9a-hjkmnp-tv-z]{26}$"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
    CreateClientRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
    Client:
      type: object
      additionalProperties: false
      required: [id, name, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ClientId"
        name:
          $ref: "#/components/schemas/Name"
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
          description: Present only when the client is disabled.
    ClientList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        next_cursor:
          type: string
          description: Present when more items follow; pass it as `cursor`.
    CreateKeyRequest:
      type: object
      additionalProperties: false
      required: [client_id, name]
      properties:
        client_id:
          $ref: "#/components/schemas/ClientId"
        name:
          $ref: "#/components/schemas/Name"
        scopes:
          type: array
          description: Defaults to every scope except `admin`. No duplicates.
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Scope"
    RotateKeyRequest:
      type: object
      additionalProperties: false
      properties:
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 600
          description: How long the previous secret keeps working.
    ApiKey:
      type: object
      additionalProperties: false
      required: [id, client_id, name, prefix, scopes, created_at]
      properties:
        id:
          type: string
          pattern: "^key_[0-9a-hjkmnp-tv-z]{26}$"
        client_id:
          $ref: "#/components/schemas/ClientId"
        name:
          $ref: "#/components/schemas/Name"
        prefix:
          type: string
          pattern: "^[0-9a-hjkmnp-tv-z]{12}$"
          description: The public part of the key (`cf_<prefix>_...`), safe to show and log.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        created_at:
          type: string
          format: date-time
        rotated_at:
          type: string
          format: date-time
        previous_valid_until:
          type: string
          format: date-time
          description: Until when the secret before the last rotation also works.
        revoked_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: Updated at most once a minute.
    CreatedApiKey:
      description: Key metadata plus the full key, returned exactly once.
      type: object
      additionalProperties: false
      required: [id, client_id, name, prefix, scopes, created_at, key]
      properties:
        id:
          type: string
          pattern: "^key_[0-9a-hjkmnp-tv-z]{26}$"
        client_id:
          $ref: "#/components/schemas/ClientId"
        name:
          $ref: "#/components/schemas/Name"
        prefix:
          type: string
          pattern: "^[0-9a-hjkmnp-tv-z]{12}$"
          description: The public part of the key (`cf_<prefix>_...`), safe to show and log.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        created_at:
          type: string
          format: date-time
        rotated_at:
          type: string
          format: date-time
        previous_valid_until:
          type: string
          format: date-time
          description: Until when the secret before the last rotation also works.
        revoked_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: Updated at most once a minute.
        key:
          type: string
          pattern: "^cf_[0-9a-hjkmnp-tv-z]{12}_[A-Za-z0-9_-]{43}$"
          description: The full API key. Store it now; it is never shown again.
    ApiKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
        next_cursor:
          type: string
    SigningKey:
      description: "An integrity signing key. Public data only; the private half is never returned."
      type: object
      additionalProperties: false
      required: [key_id, algorithm, state, current, public_key, created_at, activated_at, retired_at]
      properties:
        key_id:
          type: string
          description: The key ID (`sk_` followed by 26 characters), also the `keyid` of a signature.
        algorithm:
          type: string
          enum: [ed25519]
        state:
          type: string
          description: |
            `active` keys are published and verify; `retired` keys are published and verify old
            records but never sign.
          enum: [active, retired]
        current:
          type: boolean
          description: True for the one active key that signs.
        public_key:
          type: string
          description: The raw 32-byte Ed25519 public key in standard base64.
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
        retired_at:
          type: [string, "null"]
          format: date-time
    SigningKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SigningKey"
    PublishedSigningKey:
      type: object
      additionalProperties: false
      required: [keyid, alg, public_key, status, created_at]
      properties:
        keyid:
          type: string
          description: The key ID, as it appears in the `keyid` of a signature.
        alg:
          type: string
          enum: [ed25519]
        public_key:
          type: string
          description: The raw 32-byte Ed25519 public key in standard base64.
        status:
          type: string
          enum: [active, retired]
        created_at:
          type: string
          format: date-time
        retired_at:
          type: string
          format: date-time
          description: Present only on a retired key.
    SigningKeySet:
      description: The published public keys, oldest first.
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/PublishedSigningKey"
    AssetState:
      type: string
      description: |
        The asset lifecycle: `created`, `uploading`, `committed`, `processing`, `ready` or `failed`
        (`deleted` assets are not returned).
      enum: [created, uploading, committed, processing, ready, failed]
    UploadMethod:
      type: string
      enum: [tus, multipart]
    CreateAssetRequest:
      type: object
      additionalProperties: false
      required: [size_bytes, upload_method]
      properties:
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: The exact size of the source in bytes. Edge and commit both enforce it.
        content_type:
          type: string
          maxLength: 255
          description: Optional lower-case media type such as `video/mp4`. Stored as object metadata only.
        upload_method:
          $ref: "#/components/schemas/UploadMethod"
        mask_faces:
          type: boolean
          default: false
          description: |
            Also make a variant of this asset with every detected face blurred (ADR 0036). It is
            built after the asset is `ready`; see `masking` on the asset. Chosen at creation and
            not changeable afterwards.
    Variant:
      type: string
      enum: [original, masked]
      description: |
        A rendering of an asset (ADR 0036). `original` is the uploaded video. `masked` has faces
        blurred and exists only for an asset created with `mask_faces`. Each variant has its own
        content key.
    MaskingState:
      type: string
      enum: [pending, ready, failed]
    Masking:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/MaskingState"
        faces_detected:
          type: integer
          minimum: 0
          description: |
            How many faces the masker found. Absent until it has run. `0` means the masked variant
            was published but no face was found; the embedding application may want to warn.
    Asset:
      type: object
      additionalProperties: false
      required: [id, state, size_bytes, upload_method, mask_faces, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/AssetIdValue"
        state:
          $ref: "#/components/schemas/AssetState"
        mask_faces:
          type: boolean
          description: Whether the asset was created with `mask_faces`.
        masking:
          allOf:
            - $ref: "#/components/schemas/Masking"
          description: Present exactly when `mask_faces` is true. `pending` until the masked variant is built.
        size_bytes:
          type: integer
          format: int64
        content_type:
          type: string
        upload_method:
          $ref: "#/components/schemas/UploadMethod"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        upload_expires_at:
          type: string
          format: date-time
          description: When the upload token expires.
        committed_at:
          type: string
          format: date-time
        processing_started_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        failure_code:
          type: string
          description: Why the asset failed, for example `upload_aborted`. A stable lower_snake_case code.
    AssetIdValue:
      type: string
      pattern: "^ast_[0-9a-hjkmnp-tv-z]{26}$"
    UploadInstructions:
      type: object
      additionalProperties: false
      required: [method, url, token, expires_at]
      properties:
        method:
          $ref: "#/components/schemas/UploadMethod"
        url:
          type: string
          format: uri
          description: |
            For `tus`, the tus creation endpoint on edge. For `multipart`, the base URL of the
            parts: PUT `<url><part_number>` for each part, GET `<url>` to list them.
        token:
          type: string
          pattern: "^cfu_[A-Za-z0-9_-]{43}$"
          description: |
            The upload token, sent as `Authorization: Bearer <token>` to edge only. It is shown
            here once, works for this asset only and stops working at `expires_at`, on commit and
            on abort.
        expires_at:
          type: string
          format: date-time
        part_size_bytes:
          type: integer
          format: int64
          description: Multipart only. Send parts of exactly this size (the last may be smaller).
    CreatedAsset:
      type: object
      additionalProperties: false
      required: [asset, upload]
      properties:
        asset:
          $ref: "#/components/schemas/Asset"
        upload:
          $ref: "#/components/schemas/UploadInstructions"
    AssetList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        next_cursor:
          type: string
    AccessLogEvent:
      type: string
      enum: [session_created, session_denied, playlist, key, key_denied, heartbeat, end, revoked, expired, segments]
      description: |
        What happened:

        - `session_created`: a session was started (by API key, JWT or callback).
        - `session_denied`: a session could not be started: the viewer's limit was reached, the
          asset was not ready, or a JWT or callback authorization failed (no `viewer_id` then,
          because nothing vouches for one). Refused authorizations are rate limited, so a flood
          of bad requests does not fill the trail.
        - `playlist`: the session fetched the master playlist. Media playlists are not logged.
        - `key`: the session fetched the content key.
        - `key_denied`: the key was refused for a session that exists (revoked, ended, expired,
          or a rate limit). At most one row per session per minute per edge replica.
        - `heartbeat`: a heartbeat was accepted. At most one row per session per 5 minutes per
          edge replica.
        - `end`: the player ended the session.
        - `revoked`: the session was revoked through the API (each session of a bulk revoke gets
          a row).
        - `expired`: the background sweep ended the session (past its maximum age or idle). `at`
          is when the sweep recorded it, up to about 10 minutes after the session stopped being
          usable.
        - `segments`: how many segment requests the session made in a flush interval (about 30
          seconds); `segments_served` is that count. Only counts are kept, never which segment,
          rendition or position was fetched (invariant I10). In `presigned` delivery the player
          fetches segments from storage directly, so there are no `segments` rows.
    AccessLogEntry:
      type: object
      additionalProperties: false
      required: [event, at]
      properties:
        event:
          $ref: "#/components/schemas/AccessLogEvent"
        at:
          type: string
          format: date-time
        asset_id:
          type: string
          description: The asset the event concerns.
        session:
          type: string
          description: |
            An 8-character fingerprint of the session: the first 4 bytes, in hex, of
            SHA-256(SHA-256(session ID) followed by the tenant ID bytes). It groups the rows of one
            session and cannot be turned into the session ID. Absent when the row has no session
            (a refused creation).
        viewer_id:
          type: string
          description: The viewer ID your application chose. Absent when it is not known.
        auth_method:
          type: string
          enum: [api_key, jwt, callback]
        segments_served:
          type: integer
          description: Only on `segments` rows.
        ip:
          type: string
          description: |
            The address of the connecting peer, only if the tenant's `store_ip` setting was on when
            the row was written. Behind a reverse proxy this is the proxy's address
            (Cipherframe does not read `X-Forwarded-For`). Never present on rows that were not
            caused by the viewer's own request (API-key session creation, revocation, expiry).
        user_agent:
          type: string
          description: The `User-Agent` header, cut to 256 characters, only if `store_user_agent` was on.
        request_id:
          type: string
          description: The `X-Request-Id` of the request that caused the event, when there was one.
    AccessLogList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccessLogEntry"
        next_cursor:
          type: string
          description: Present when there are older rows. Pass it as `cursor`.
    PlaybackEventKind:
      type: string
      enum: [key_replay, key_rate, session_limit, rapid_session_creation, segments_without_key]
      description: |
        What was detected. Every kind is computed from counters and times Cipherframe keeps for
        enforcement and for the access trail; nothing about what a viewer watched or did in the
        player is used (invariant I10).

        - `key_replay`: one playback token asked for the key more often than the tenant's
          `key_fetches_per_token`. `detail`: `limit`.
        - `key_rate`: one session asked for the key more often than `key_requests_per_minute` in
          a minute. `detail`: `limit`.
        - `session_limit`: a session creation was refused with `session_limit` because the viewer
          had `max_sessions_per_viewer` active sessions. Raised at most once per viewer per 10
          minutes. A player that retries triggers it too, so it is information, and it can never
          be an `auto_revoke` kind.
        - `rapid_session_creation`: more than `anomaly_sessions_per_viewer_10m` sessions were
          created for one viewer in a sliding 10 minutes. Raised at most once per viewer per 10
          minutes. `detail`: `limit`, `sessions`.
        - `segments_without_key`: a session was served more than `anomaly_segments_without_key`
          segments without ever being served the key. Raised once per session. `detail`: `limit`,
          `segments`. Only `proxy` delivery counts segments: with `presigned` delivery storage
          serves them and this signal never fires.

        None of these detects a careful scraper that fetches the key like a player and paces
        itself, and HLS with AES-128 is not DRM: a viewer who receives the key can decrypt what
        they receive.
    PlaybackEvent:
      type: object
      additionalProperties: false
      required: [id, kind, at, asset_id, detail]
      properties:
        id:
          type: string
          format: uuid
          description: The event's ID, stable and unique. Webhook deliveries (M7) will carry it.
        kind:
          $ref: "#/components/schemas/PlaybackEventKind"
        at:
          type: string
          format: date-time
        asset_id:
          type: string
          description: The asset the event concerns.
        viewer_id:
          type: string
          description: The viewer ID your application chose, when known.
        session:
          type: string
          description: |
            An 8-character fingerprint of the session, the same one the access log shows
            (`AccessLogEntry.session`). It cannot be turned into the session ID. Absent for the
            viewer-level kinds (`session_limit`, `rapid_session_creation`).
        detail:
          type: object
          description: Small integers only, the threshold that was crossed and the observed count.
          additionalProperties:
            type: integer
            format: int64
    PlaybackEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaybackEvent"
        next_cursor:
          type: string
          description: Present when there are older events. Pass it as `cursor`.
    PrivacySettings:
      description: |
        A tenant's effective privacy settings. Gate P11 sets the final defaults and adds fields.
      type: object
      additionalProperties: false
      required: [store_ip, store_user_agent]
      properties:
        store_ip:
          type: boolean
          description: |
            Keep the connecting peer's IP address in the access trail. Default `false`.
        store_user_agent:
          type: boolean
          description: Keep the viewer's `User-Agent` (cut to 256 characters) in the access trail. Default `false`.
        updated_at:
          type: string
          format: date-time
          description: When the settings were last replaced. Absent while the defaults are in force.
    PrivacySettingsInput:
      description: |
        Every privacy setting. The schema does not mark the fields `required` so that a missing one
        can be told apart from `false`: it is `invalid_request` with an `errors` entry naming it.
      type: object
      additionalProperties: false
      properties:
        store_ip:
          type: boolean
        store_user_agent:
          type: boolean
    SessionId:
      type: string
      pattern: "^ses_[0-9a-hjkmnp-tv-z]{52}$"
      description: A session ID (`ses_` followed by 52 characters). It is a capability, so never log or share it.
    CreatePlaybackSessionRequest:
      type: object
      additionalProperties: false
      required: [asset_id, viewer_id]
      properties:
        asset_id:
          $ref: "#/components/schemas/AssetIdValue"
        viewer_id:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Your pseudonymous ID for the viewer: 1 to 128 printable characters, no control
            characters. Use an ID only your application can link to a person, never an email
            address.
        variant:
          allOf:
            - $ref: "#/components/schemas/Variant"
          description: |
            Which variant the session may play. Default: `masked` for an asset created with
            `mask_faces`, `original` otherwise. `masked` on an asset without masking is
            `409 variant_unavailable`; `masked` before it is ready is `409 variant_not_ready`. It
            never falls back to the original.
    CreatedPlaybackSession:
      type: object
      additionalProperties: false
      required:
        - session_id
        - token
        - token_expires_at
        - heartbeat_interval_seconds
        - session_expires_at
        - manifest_url
        - token_transport
        - variant
      properties:
        session_id:
          $ref: "#/components/schemas/SessionId"
        variant:
          $ref: "#/components/schemas/Variant"
        token:
          type: string
          maxLength: 1024
          description: |
            The playback token (`v1.<payload>.<kid>.<mac>`), shown only here. It allows the
            manifest, key and segment requests of this session and asset until `token_expires_at`.
            Each heartbeat returns a fresh one.
        token_expires_at:
          type: string
          format: date-time
          description: When the token stops working. Never later than `session_expires_at`.
        heartbeat_interval_seconds:
          type: integer
          description: How often the player should send a heartbeat.
        session_expires_at:
          type: string
          format: date-time
          description: The session ends at this time at the latest, heartbeats or not.
        manifest_url:
          type: string
          format: uri
          description: |
            The master playlist on edge, `<edge URL>/v1/play/<session_id>/master.m3u8`. It ends
            with `?t=<token>` only when `token_transport` is `url`.
        token_transport:
          type: string
          enum: [header, url]
          description: |
            `header`: send the token as `Authorization: Bearer <token>`. `url`: the tenant opted in
            to tokens in URLs (ADR 0030), and `manifest_url` carries it.
    PlaybackHeartbeat:
      type: object
      additionalProperties: false
      required: [token, token_expires_at, heartbeat_interval_seconds, session_expires_at]
      properties:
        token:
          type: string
          maxLength: 1024
          description: |
            A fresh playback token with the manifest, key and segment scopes, shown only here. Use
            it for every later request; the previous token works until its own expiry.
        token_expires_at:
          type: string
          format: date-time
          description: When the token stops working. Never later than `session_expires_at`.
        heartbeat_interval_seconds:
          type: integer
          description: How often to send the next heartbeat.
        session_expires_at:
          type: string
          format: date-time
          description: The session ends at this time at the latest, heartbeats or not.
    RevokePlaybackSessionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
          description: |
            Why the session was revoked: at most 200 printable characters, no control characters.
            Stored and returned as is. Do not put personal data in it.
    RevokePlaybackSessionsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        viewer_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Revoke the active sessions of this viewer.
        asset_id:
          $ref: "#/components/schemas/AssetIdValue"
        reason:
          type: string
          maxLength: 200
          description: As for a single revoke. Do not put personal data in it.
      description: At least one of `viewer_id` and `asset_id` is required.
    RevokedPlaybackSessions:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked:
          type: integer
          minimum: 0
          description: How many sessions were revoked.
    PlaybackSessionStatus:
      type: object
      additionalProperties: false
      required:
        - session_id
        - asset_id
        - viewer_id
        - state
        - created_at
        - last_heartbeat_at
        - session_expires_at
      properties:
        session_id:
          $ref: "#/components/schemas/SessionId"
        asset_id:
          $ref: "#/components/schemas/AssetIdValue"
        viewer_id:
          type: string
        state:
          type: string
          enum: [active, ended, revoked]
          description: |
            `ended` also covers a session that is idle past the idle timeout or past its maximum
            age but not yet recorded as ended.
        created_at:
          type: string
          format: date-time
        last_heartbeat_at:
          type: string
          format: date-time
        session_expires_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Present only once the session has been recorded as ended.
        revoked_at:
          type: string
          format: date-time
          description: Present only when the session was revoked.
        revoke_reason:
          type: string
          description: Present only when a reason was given at revocation.
    PlaybackSettingsInput:
      description: |
        Every playback setting of a tenant (ADR 0028, 0030). This is a full replacement, so every
        field is required: a missing field is `invalid_request` with an `errors` entry naming it.
        (The schema does not mark them `required` so that a missing field can be told apart from
        a zero value, which `max_sessions_per_viewer` and `token_in_url` accept.)
      type: object
      additionalProperties: false
      properties:
        token_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: How long a playback token works. Default 600.
        heartbeat_interval_seconds:
          type: integer
          minimum: 10
          maximum: 600
          description: |
            How often the player sends a heartbeat. Must be less than `token_ttl_seconds` and less
            than `idle_timeout_seconds`. Default 60.
        idle_timeout_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          description: A session with no heartbeat for this long ends. Default 300.
        session_max_seconds:
          type: integer
          minimum: 300
          maximum: 86400
          description: A session ends this long after it starts, at the latest. Default 14400 (4 hours).
        max_sessions_per_viewer:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            The most active sessions one `viewer_id` may have; a new one beyond it is
            `409 session_limit`. 0 means unlimited. Default 3.
        key_fetches_per_token:
          type: integer
          minimum: 1
          maximum: 1000
          description: The most key requests one playback token may make. Default 20.
        key_requests_per_minute:
          type: integer
          minimum: 1
          maximum: 600
          description: The most key requests one session may make per minute. Default 30.
        allowed_origins:
          type: array
          maxItems: 20
          uniqueItems: true
          description: |
            Browser origins allowed to play (CORS on edge). Each is an exact origin
            `https://host[:port]`, or `http://localhost[:port]` for development: lower case, no
            path, no wildcard, and no port that is the scheme's default. Default empty.
          items:
            type: string
            maxLength: 300
        token_in_url:
          type: boolean
          description: |
            Put the playback token in the manifest URL as `?t=` for native HLS players that cannot
            set headers (ADR 0030). Off by default: tokens in URLs can end up in browser history
            and in proxy and CDN logs.
        delivery:
          type: string
          enum: [proxy, presigned]
          description: |
            How segments reach the player (ADR 0032). `proxy` (the default): edge serves every
            segment after checking the token. `presigned`: media playlists carry short-lived
            presigned storage URLs for the init segment and each media segment, so storage or a
            CDN serves the (encrypted) bytes directly. A URL expires when the playback token does,
            or after 10 minutes, whichever is first. The URLs are credentials until then: they
            can appear in playlists, browser history and the logs of intermediaries. The key
            endpoint is always served by edge, so revocation still applies. In `presigned` mode
            the delivery bucket needs a CORS rule that allows the tenant's origins to GET.
        anomaly_sessions_per_viewer_10m:
          type: integer
          minimum: 0
          maximum: 1000
          description: |
            More than this many sessions created for one viewer in a sliding 10 minutes raises
            `rapid_session_creation`. 0 disables the signal. Default 10.
        anomaly_segments_without_key:
          type: integer
          minimum: 0
          maximum: 100000
          description: |
            A session served more than this many segments without ever being served the key
            raises `segments_without_key`. 0 disables the signal. Only `proxy` delivery counts
            segments. Default 30.
        auto_revoke:
          type: array
          maxItems: 4
          uniqueItems: true
          description: |
            Event kinds that also revoke: when one of these is detected the session is revoked
            with the reason `auto:<kind>` (for `rapid_session_creation`, every active session of
            the viewer), the access trail gets a `revoked` row, and the action is audited. An
            empty list, the default, only records events. Revocation is automatic and a false
            positive costs a viewer their playback, so enable a kind only after watching its
            events for a while. `session_limit` is not allowed.
          items:
            type: string
            enum: [key_replay, key_rate, rapid_session_creation, segments_without_key]
    PlaybackSettings:
      description: A tenant's effective playback settings.
      type: object
      additionalProperties: false
      required:
        - token_ttl_seconds
        - heartbeat_interval_seconds
        - idle_timeout_seconds
        - session_max_seconds
        - max_sessions_per_viewer
        - key_fetches_per_token
        - key_requests_per_minute
        - allowed_origins
        - token_in_url
        - delivery
        - anomaly_sessions_per_viewer_10m
        - anomaly_segments_without_key
        - auto_revoke
      properties:
        token_ttl_seconds:
          type: integer
        heartbeat_interval_seconds:
          type: integer
        idle_timeout_seconds:
          type: integer
        session_max_seconds:
          type: integer
        max_sessions_per_viewer:
          type: integer
          description: 0 means unlimited.
        key_fetches_per_token:
          type: integer
        key_requests_per_minute:
          type: integer
        allowed_origins:
          type: array
          items:
            type: string
        token_in_url:
          type: boolean
        delivery:
          type: string
          enum: [proxy, presigned]
        anomaly_sessions_per_viewer_10m:
          type: integer
          description: 0 means the signal is off.
        anomaly_segments_without_key:
          type: integer
          description: 0 means the signal is off.
        auto_revoke:
          type: array
          items:
            type: string
            enum: [key_replay, key_rate, rapid_session_creation, segments_without_key]
        updated_at:
          type: string
          format: date-time
          description: When the settings were last replaced. Absent while the defaults are in force.
    PlaybackAuthInput:
      description: |
        The JWT and callback settings of a tenant (ADR 0029, 0031). A full replacement: a field you
        leave out goes back to its default (the viewer claim to `sub`, the rest to off or empty).
        `jwt_enabled` and `callback_enabled` are required: a missing one is `invalid_request` with
        an `errors` entry naming it. (The schema does not mark them `required` so that a missing
        flag can be told apart from `false`.)
      type: object
      additionalProperties: false
      properties:
        jwt_enabled:
          type: boolean
        jwt_issuer:
          type: string
          maxLength: 512
          description: The exact `iss` your tokens carry. Required when `jwt_enabled` is true.
        jwt_audiences:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Accepted `aud` values; a token needs to name at least one. Required when `jwt_enabled` is true.
          items:
            type: string
            minLength: 1
            maxLength: 256
        jwt_jwks_url:
          type: [string, "null"]
          maxLength: 2048
          description: |
            An https URL of your JWKS document (at most 64 KiB), cached about 10 minutes and
            refetched at most every 30 seconds when a token names an unknown `kid`. No redirects;
            hosts that resolve to private, loopback or link-local addresses are refused.
        jwt_viewer_claim:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9_.:-]+$"
          description: The claim that holds the viewer ID. Default `sub`.
        callback_enabled:
          type: boolean
          description: Needs a callback secret (see `rotatePlaybackCallbackSecret`).
        callback_url:
          type: [string, "null"]
          maxLength: 2048
          description: Your https callback URL. Required when `callback_enabled` is true.
    PlaybackAuth:
      description: A tenant's playback authorization settings. The callback secret is never part of it.
      type: object
      additionalProperties: false
      required:
        - jwt_enabled
        - jwt_issuer
        - jwt_audiences
        - jwt_jwks_url
        - jwt_viewer_claim
        - jwt_keys
        - callback_enabled
        - callback_url
        - callback_secret_configured
        - callback_secret_version
      properties:
        jwt_enabled:
          type: boolean
        jwt_issuer:
          type: string
        jwt_audiences:
          type: array
          items:
            type: string
        jwt_jwks_url:
          type: [string, "null"]
        jwt_viewer_claim:
          type: string
        jwt_keys:
          type: array
          description: The uploaded public keys, by `kid`.
          items:
            $ref: "#/components/schemas/PlaybackJwtKey"
        callback_enabled:
          type: boolean
        callback_url:
          type: [string, "null"]
        callback_secret_configured:
          type: boolean
          description: True once the secret has been rotated at least once.
        callback_secret_version:
          type: integer
          description: 0 until the first rotation, then increases by one per rotation.
        callback_secret_rotated_at:
          type: string
          format: date-time
        callback_previous_secret_valid_until:
          type: string
          format: date-time
          description: While present, callbacks carry a second signature made with the previous secret.
        updated_at:
          type: string
          format: date-time
          description: When the settings were last replaced. Absent while the defaults are in force.
    PlaybackJwtKey:
      type: object
      additionalProperties: false
      required: [kid, alg, created_at]
      properties:
        kid:
          type: string
        alg:
          type: string
          enum: [EdDSA, ES256, RS256]
        created_at:
          type: string
          format: date-time
    PublicJwk:
      description: |
        A public JWK (RFC 7517) with an `alg`. `kty` is `OKP` (`crv` `Ed25519`, alg `EdDSA`), `EC`
        (`crv` `P-256`, alg `ES256`) or `RSA` (at least 2048 bits, alg `RS256`). Members other than
        those listed are accepted by the schema and judged by the server: a private member such as
        `d` is refused.
      type: object
      required: [kty, alg]
      additionalProperties: true
      properties:
        kty:
          type: string
        alg:
          type: string
          enum: [EdDSA, ES256, RS256]
        kid:
          type: string
        use:
          type: string
        crv:
          type: string
        x:
          type: string
        y:
          type: string
        "n":
          type: string
        e:
          type: string
    RotatedCallbackSecret:
      type: object
      additionalProperties: false
      required: [secret, version]
      properties:
        secret:
          type: string
          description: |
            The callback secret, `whsec_` followed by the standard base64 of 32 random bytes.
            Shown only here; store it now.
        version:
          type: integer
        previous_valid_until:
          type: string
          format: date-time
          description: Until when the previous secret also signs callbacks. Absent on the first rotation.
    CreateBrowserPlaybackSessionRequest:
      type: object
      additionalProperties: false
      required: [asset_id, method]
      properties:
        asset_id:
          $ref: "#/components/schemas/AssetIdValue"
        method:
          type: string
          enum: [jwt, callback]
          description: How your application authorises the viewer.
        ticket:
          type: string
          minLength: 1
          maxLength: 2048
          description: |
            For `callback` (required): an opaque string from your page that your callback
            understands, for example a short-lived order or login reference. Cipherframe forwards
            it and never logs it. Ignored for `jwt`.
        variant:
          allOf:
            - $ref: "#/components/schemas/Variant"
          description: |
            Optional, and never a choice: the variant is decided by your application (the `variant`
            claim of the JWT, or your callback approving the variant it is told about), else it is
            the asset's default. A value that differs from the decided one is `403`.
    UploadPart:
      type: object
      additionalProperties: false
      required: [part_number, size_bytes, etag]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        size_bytes:
          type: integer
          format: int64
        etag:
          type: string
    UploadPartList:
      type: object
      additionalProperties: false
      required: [part_size_bytes, items]
      properties:
        part_size_bytes:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/UploadPart"
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadyCheck"
    ReadyCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: Fixed check name, for example `database`.
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      description: RFC 9457 problem details with Cipherframe extensions (ADR 0012).
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, retryable, request_id]
      properties:
        type:
          type: string
          description: "`urn:cipherframe:error:<code>`."
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable identifier to switch on. The closed registry in `internal/errs`.
          enum:
            - artifact_not_found
            - asset_not_ready
            - conflict
            - dependency_unavailable
            - forbidden
            - internal_error
            - invalid_request
            - method_not_allowed
            - not_found
            - payload_too_large
            - rate_limited
            - session_limit
            - timeout
            - unauthenticated
            - variant_not_ready
            - variant_unavailable
        retryable:
          type: boolean
        request_id:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        errors:
          type: array
          description: |
            Present on some `invalid_request` responses: one entry per invalid field. Messages are
            fixed text and never quote the submitted value.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: The JSON name of the field, with an index for list items, for example `allowed_origins[2]`.
        message:
          type: string
    ArtifactVariant:
      type: string
      enum: [original, masked]
    DsseEnvelope:
      description: |
        A DSSE v1 envelope (ADR 0033). `payload` is the base64 of the canonical manifest JSON; the
        signed bytes are `PAE(payloadType, payload)`. See `docs/integrity.md` for the manifest
        format.
      type: object
      additionalProperties: false
      required: [payloadType, payload, signatures]
      properties:
        payloadType:
          type: string
          enum: [application/vnd.cipherframe.manifest+json]
        payload:
          type: string
          description: Standard base64 of the canonical manifest.
        signatures:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [keyid, sig]
            properties:
              keyid:
                type: string
                description: The `keyid` of a published signing key.
              sig:
                type: string
                description: Standard base64 of the 64-byte Ed25519 signature.
    Sha256Hex:
      type: string
      description: A SHA-256 as 64 lowercase hex digits.
      pattern: "^[0-9a-f]{64}$"
    ProofLevel:
      description: A leaf's place in the top-level tree (RFC 9162 inclusion proof).
      type: object
      additionalProperties: false
      required: [leaf_index, tree_size, audit_path, root]
      properties:
        leaf_index:
          type: integer
          minimum: 0
        tree_size:
          type: integer
          minimum: 1
        audit_path:
          type: array
          items:
            $ref: "#/components/schemas/Sha256Hex"
        root:
          allOf:
            - $ref: "#/components/schemas/Sha256Hex"
          description: The top-level root, equal to `top_level.root` of the variant in the manifest.
    InclusionProof:
      description: |
        Proves that the artifact is covered by the manifest's top-level root. For a segment the
        rendition members prove its hash in the rendition tree (leaf data: the artifact's SHA-256,
        leaves: init then segments in playlist order) and `top_level` proves `rendition_root` in
        the top-level tree. For a playlist the rendition members are absent and `top_level` proves
        the playlist's hash directly. Trees and hashing are specified in `docs/integrity.md`.
      type: object
      additionalProperties: false
      required: [asset_id, variant, path, sha256, size, top_level]
      properties:
        asset_id:
          type: string
        variant:
          $ref: "#/components/schemas/ArtifactVariant"
        path:
          type: string
        sha256:
          $ref: "#/components/schemas/Sha256Hex"
        size:
          type: integer
          format: int64
        leaf_index:
          type: integer
          minimum: 0
          description: Index of the artifact in its rendition tree. Absent for a playlist.
        tree_size:
          type: integer
          minimum: 2
          description: Leaves of the rendition tree. Absent for a playlist.
        rendition:
          type: string
          description: The rendition name. Absent for a playlist.
        rendition_root:
          $ref: "#/components/schemas/Sha256Hex"
        audit_path:
          type: array
          description: Audit path in the rendition tree. Absent for a playlist.
          items:
            $ref: "#/components/schemas/Sha256Hex"
        top_level:
          $ref: "#/components/schemas/ProofLevel"
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [sha256]
      properties:
        sha256:
          $ref: "#/components/schemas/Sha256Hex"
        asset_id:
          type: string
          description: With `path`, compare against this asset's manifest.
        path:
          type: string
          maxLength: 512
          description: The artifact's manifest path. Needs `asset_id`.
        variant:
          allOf:
            - $ref: "#/components/schemas/ArtifactVariant"
          description: Needs `asset_id` and `path`. Default `original`.
    VerifyResult:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [ours, modified, cannot_say]
        asset_id:
          type: string
          description: Present with `ours` and `modified`.
        variant:
          $ref: "#/components/schemas/ArtifactVariant"
        path:
          type: string
          description: The manifest path (never a storage key). Present with `ours` and `modified`.
        proof:
          $ref: "#/components/schemas/InclusionProof"
        reason:
          type: string
          enum: [no_match, manifest_unverifiable]
          description: |
            Present with `cannot_say`: `no_match` when the asset, path, variant or hash is unknown to
            this tenant, `manifest_unverifiable` when the stored manifest's signature could not be
            verified with the published keys or its content could not be read.
